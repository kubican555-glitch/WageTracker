        // --- Czech Holiday Helper ---
        const getCzechHolidays = (year) => {
            const holidays = {

            const res = { ...holidays };
            if (easter[year]) {

                res[easter[year][1]] = 'Velikonoční pondělí'; 
            }
            return res;
        };

        // --- Animated Number Ticker Component ---
        const AnimatedNumber = ({ value }) => {
            const [displayValue, setDisplayValue] = useState(0);

            useEffect(() => {
                let startTimestamp = null;
                const duration = 500; 
                const startValue = displayValue;
                const endValue = value;

                if (startValue === endValue) return;

                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const easeProgress = 1 - Math.pow(1 - progress, 4); 
                    setDisplayValue(Math.floor(startValue + (endValue - startValue) * easeProgress));
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        setDisplayValue(endValue);
                    }
                };
                window.requestAnimationFrame(step);
            }, [value]);

            return <span>{displayValue.toLocaleString('cs-CZ')}</span>;
        };

        // --- Toast Notification Component ---

        // --- Authentication Screen ---

            const handleLogin = async (e) => {
                e.preventDefault();
                if (loginId.length !== 8) return setError('ID musí mít 8 číslic.');
                setLoading(true); setError('');
                try {
                    const snap = await db.collection('profiles').doc(loginId).get();

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!firstName.trim() || !lastName.trim()) return setError('Vyplň jméno a příjmení.');

                try {
                    const newPin = Math.floor(10000000 + Math.random() * 90000000).toString();
                    const profile = { firstName: firstName.trim(), lastName: lastName.trim(), pin: newPin, createdAt: new Date().toISOString() };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-xl dark:shadow-none p-8 border border-slate-200/60 dark:border-slate-800/80">

                                <i className="fa-solid fa-wallet text-[28px]"></i>
                            </div>

                        {error && (

                                <i className="fa-solid fa-circle-exclamation text-sm"></i> <span>{error}</span>
                            </div>

                        {view === 'login' && (
                            <form onSubmit={handleLogin} className="space-y-6">
                                <input type="text" name="username" autoComplete="username" value="WageTracker Uživatel" className="hidden" readOnly />
                                <div>
                                    <label className="text-[10px] font-bold uppercase text-slate-400 mb-3 block text-center tracking-widest px-1">Zadej své 8-místné ID</label>
                                    
                                    <div className="relative flex justify-between gap-1 w-full mt-2 group">
                                        {[0,1,2,3,4,5,6,7].map(i => (
                                            <div key={i} className={`w-9 h-14 flex items-center justify-center rounded-2xl text-2xl font-black transition-all duration-200 ${
                                                loginId.length === i 
                                                ? 'ring-2 ring-blue-500 bg-white dark:bg-slate-800 scale-105 z-10 shadow-md' 
                                                : loginId.length > i 
                                                    ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800/50' 
                                                    : 'bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 text-transparent'
                                            }`}>
                                                {loginId[i] ? loginId[i] : ''}
                                            </div>
                                        ))}
                                        <input 
                                            type="password" 
                                            name="password" 
                                            autoComplete="current-password" 
                                            inputMode="numeric" 
                                            pattern="[0-9]*" 
                                            maxLength={8} 
                                            required
                                            value={loginId} 
                                            onChange={e => setLoginId(e.target.value.replace(/\D/g, '').slice(0, 8))} 
                                            className="absolute inset-0 w-full h-full opacity-0 text-transparent bg-transparent caret-transparent outline-none cursor-text z-20"
                                            style={{ WebkitUserSelect: 'text' }}
                                        />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 active:scale-95 transition-all mt-4">
                                    {loading ? <i className="fa-solid fa-spinner fa-spin text-lg"></i> : <i className="fa-solid fa-arrow-right-to-bracket"></i>} PŘIHLÁSIT SE
                                </button>
                                <p className="text-center text-xs text-slate-500 mt-4">Nemáš ještě účet? <button type="button" onClick={() => {setView('register'); setError('')}} className="text-blue-600 dark:text-blue-400 font-bold underline">Zaregistruj se</button></p>
                            </form>
                        )}
                        
                        {view === 'register' && (
                            <form onSubmit={handleRegister} className="space-y-4">
                                <div>
                                    <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-widest pl-1">Jméno</label>

                                </div>

                                </div>

                                    {loading ? <i className="fa-solid fa-spinner fa-spin text-lg"></i> : <i className="fa-solid fa-user-plus"></i>} VYTVOŘIT ÚČET

                        {view === 'success' && (

        // --- Main WageTracker Application ---
        const App = () => {
            const [isInitializing, setIsInitializing] = useState(true);
            const [globalError, setGlobalError] = useState('');
            const [activePin, setActivePin] = useState(() => localStorage.getItem('wage-tracker-pin'));
            const [profileName, setProfileName] = useState('');
            const [activeTab, setActiveTab] = useState('calendar'); 
            const [currentDate, setCurrentDate] = useState(new Date());
            const [shifts, setShifts] = useState({});
            const [editingDate, setEditingDate] = useState(null);
            const [editorType, setEditorType] = useState('work'); 
            const [toastMessage, setToastMessage] = useState('');
            
            const [startHour, setStartHour] = useState('');
            const [startMin, setStartMin] = useState('');
            const [endHour, setEndHour] = useState('');
            const [endMin, setEndMin] = useState('');
            
            const [breakValue, setBreakValue] = useState('');
            const [hoursValue, setHoursValue] = useState('8');
            const [rateValue, setRateValue] = useState('0');
            const [shiftContract, setShiftContract] = useState('HPP');

            const [showBulkModal, setShowBulkModal] = useState(false);
            const [bulkRate, setBulkRate] = useState('');
            const [bulkTypeFilter, setBulkTypeFilter] = useState('all');
            const [bulkContractFilter, setBulkContractFilter] = useState('all');
            const [bulkLoading, setBulkLoading] = useState(false);
            const [bulkStatus, setBulkStatus] = useState('');

            const touchStartX = useRef(0);
            const touchEndX = useRef(0);
            const touchStartY = useRef(0);
            const touchEndY = useRef(0);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 2400);
            };

            const [settings, setSettings] = useState({
                defaultRate: 180, 
                defaultContract: 'HPP', 
                isDark: localStorage.getItem('shift-theme') === 'dark',
                bonuses: { night: 20, weekend: 10, holiday: 100 },
                discounts: { taxpayer: 2570, kids: 0 },
                uniformEnabled: true,       
                uniformRate: 5,             
                disabledUniformMonths: {},  
                customUniformRates: {}, 
                quarterlyAverages: {        
                    '2024-Q1': 139.23, '2024-Q2': 139.23, '2024-Q3': 139.23, '2024-Q4': 139.23,
                    '2025-Q1': 145.00, '2025-Q2': 145.00, '2025-Q3': 145.00, '2025-Q4': 145.00,
                    '2026-Q1': 150.00, '2026-Q2': 150.00, '2026-Q3': 150.00, '2026-Q4': 150.00
                },
                useAverageForPremiums: true  
            });

            const contractLabels = { 'HPP': 'Pracovní poměr (HPP)', 'DPČ': 'Dohoda DPČ', 'DPP': 'Dohoda DPP' };

            // Dynamické chytré předvolby podle reálné historie uživatelových směn
            const smartPresets = useMemo(() => {
                const shiftCounts = {};
                const sortedDates = Object.keys(shifts).sort().reverse();
                
                sortedDates.forEach(dateStr => {
                    const s = shifts[dateStr];
                    if (s && s.type === 'work' && s.raw && s.raw.includes('-')) {
                        const cleanRaw = s.raw.replace(/\s/g, '');
                        if (!shiftCounts[cleanRaw]) {
                            shiftCounts[cleanRaw] = {
                                raw: cleanRaw,
                                count: 0,
                                lastDate: dateStr,
                                breakMinutes: s.breakMinutes !== undefined ? s.breakMinutes : 30
                            };
                        }
                        shiftCounts[cleanRaw].count += 1;
                    }
                });

                const sortedShifts = Object.values(shiftCounts).sort((a, b) => {
                    if (b.count !== a.count) return b.count - a.count;
                    return b.lastDate.localeCompare(a.lastDate);
                });

                if (sortedShifts.length > 0) {
                    return sortedShifts.slice(0, 5).map(item => {
                        const parts = item.raw.split('-');
                        const p1 = parts[0].split(':');
                        const p2 = parts[1].split(':');
                        const sh = p1[0].padStart(2, '0');
                        const sm = (p1[1] || '00').padStart(2, '0');
                        const eh = p2[0].padStart(2, '0');
                        const em = (p2[1] || '00').padStart(2, '0');
                        return {
                            label: `${sh}:${sm} – ${eh}:${em}`,
                            sh, sm, eh, em,
                            brk: item.breakMinutes.toString(),
                            isDynamic: true,
                            count: item.count
                        };
                    });
                }

                // Výchozí šablony, pokud ještě v historii žádné směny nejsou
                return [
                    { label: '06:00 – 14:00', sh: '06', sm: '00', eh: '14', em: '00', brk: '30' },
                    { label: '14:00 – 22:00', sh: '14', sm: '00', eh: '22', em: '00', brk: '30' },
                    { label: '22:00 – 06:00', sh: '22', sm: '00', eh: '06', em: '00', brk: '30' },
                    { label: '07:00 – 19:00', sh: '07', sm: '00', eh: '19', em: '00', brk: '30' },
                    { label: '19:00 – 07:00', sh: '19', sm: '00', eh: '07', em: '00', brk: '30' },
                ];
            }, [shifts]);

            // Předchozí směna pro rychlé zopakování jedním kliknutím
            const lastShiftBeforeEditing = useMemo(() => {
                if (!editingDate) return null;
                const priorDates = Object.keys(shifts).filter(d => d < editingDate && shifts[d]?.raw).sort().reverse();
                if (priorDates.length > 0) {
                    return { date: priorDates[0], shift: shifts[priorDates[0]] };
                }
                return null;
            }, [editingDate, shifts]);

            useEffect(() => {
                if (!auth) return setGlobalError('Firebase selhal.');
                auth.signInAnonymously().then(() => {
                    if (activePin) {
                        db.collection('profiles').doc(activePin).get().then(s => { 
                            if (s.exists) setProfileName(`${s.data().firstName} ${s.data().lastName}`); 
                        });
                        db.collection('settings').doc(activePin).get().then(s => { 
                            if (s.exists) setSettings(prev => ({ ...prev, ...s.data() })); 
                        });
                        db.collection(`shifts_${activePin}`).onSnapshot(snap => {
                            const data = {}; snap.forEach(d => data[d.id] = d.data()); setShifts(data);
                        }, err => { setGlobalError('Chyba databáze.'); });
                    }
                    setIsInitializing(false);
                }).catch(e => { setGlobalError(e.message); setIsInitializing(false); });
            }, [activePin]);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', settings.isDark);
                localStorage.setItem('shift-theme', settings.isDark ? 'dark' : 'light');
            }, [settings.isDark]);

            const saveSettings = async (newSettings) => {
                setSettings(newSettings);
                if (activePin) await db.collection('settings').doc(activePin).set(newSettings);
            };

            const handleLoginSuccess = (pin, pData) => {
                localStorage.setItem('wage-tracker-pin', pin); setActivePin(pin);
                if (pData) setProfileName(`${pData.firstName} ${pData.lastName}`);
            };

            const handleLogout = () => { 
                localStorage.removeItem('wage-tracker-pin'); 
                setActivePin(null); 
            };

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const holidays = useMemo(() => getCzechHolidays(year), [year]);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;

            const isViewingCurrentMonth = useMemo(() => {
                const now = new Date();
                return now.getFullYear() === year && now.getMonth() === month;
            }, [year, month]);

            // Formátování hodin striktně na 2 desetinná místa
            const formatHrs = (m) => `${(m/60).toLocaleString('cs-CZ', {minimumFractionDigits: 2, maximumFractionDigits: 2})}h`;

            // Dynamic Duration Calculation for Live Editor
            const liveDuration = useMemo(() => {
                if (editorType !== 'work') return null;
                if (startHour === '' || endHour === '') return null;
                
                const sh = parseInt(startHour, 10) || 0;
                const sm = startMin !== '' ? (parseInt(startMin, 10) || 0) : 0;
                const eh = parseInt(endHour, 10) || 0;
                const em = endMin !== '' ? (parseInt(endMin, 10) || 0) : 0;
                
                const startTotal = sh * 60 + sm;
                const endTotal = eh * 60 + em;
                let diff = endTotal - startTotal;
                if (diff < 0) diff += 1440; 

                let breakMins = breakValue !== '' ? parseInt(breakValue, 10) : (diff > 360 ? 30 : 0);
                if (isNaN(breakMins)) breakMins = 0;
                let net = Math.max(0, diff - breakMins);

                const hours = Math.floor(net / 60);
                const mins = net % 60;

                return { netHours: hours, netMins: mins, breakMins, netTotalMins: net };
            }, [startHour, startMin, endHour, endMin, breakValue, editorType]);

            const getQuarterKeyForDateStr = (dateStr) => {
                const dObj = new Date(dateStr);
                const q = Math.floor(dObj.getMonth() / 3) + 1;
                return `${dObj.getFullYear()}-Q${q}`;
            };

            // Advanced Salary Calculations
            const calculateShiftDetails = (startMin, endMin, customBreak, rate, dateStr, type, fixedHours) => {
                if (type !== 'work') {
                    return { 
                        type, netMinutes: fixedHours * 60, base: fixedHours * rate, 
                        gross: type === 'vacation' ? fixedHours * rate : fixedHours * rate * 0.6, 
                        breakMinutes: 0, raw: `${fixedHours}h`, nBonus: 0, wBonus: 0, hBonus: 0,
                        nightHrs: 0, weekendHrs: 0, holidayHrs: 0
                    };
                }

                let diff = endMin - startMin; if (diff < 0) diff += 1440;
                let breakMins = customBreak !== '' ? parseInt(customBreak, 10) : (diff > 360 ? 30 : 0);
                let net = Math.max(0, diff - breakMins);
                
                const dObj = new Date(dateStr); 
                const isWk = [0, 6].includes(dObj.getDay());
                const isHol = !!holidays[`${String(month+1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`];
                
                // Pauza calculation
                let rawNightMins = 0; 
                let rawDayMins = 0;
                for (let i = 0; i < diff; i++) { 
                    const cur = (startMin + i) % 1440; 
                    if (cur >= 1320 || cur < 360) rawNightMins++; 
                    else rawDayMins++;
                }
                
                let remainingBreak = Math.max(0, breakMins - rawDayMins);
                const nightMinutes = Math.max(0, rawNightMins - remainingBreak);
                
                const weekendMinutes = isWk ? net : 0;
                const holidayMinutes = isHol ? net : 0;

                const qKey = getQuarterKeyForDateStr(dateStr);
                const qAverage = settings.quarterlyAverages?.[qKey];
                const premiumBaseRate = (settings.useAverageForPremiums && qAverage > 0) ? parseFloat(qAverage) : rate;

                const base = (net / 60) * rate;
                const nB = (nightMinutes / 60) * premiumBaseRate * (settings.bonuses.night / 100);
                const wB = isWk ? (net / 60) * premiumBaseRate * (settings.bonuses.weekend / 100) : 0;
                const hB = isHol ? (net / 60) * premiumBaseRate * (settings.bonuses.holiday / 100) : 0;

                return { 
                    type: 'work', netMinutes: net, base, nBonus: nB, wBonus: wB, hBonus: hB, 
                    gross: base + nB + wB + hB, breakMinutes: breakMins,
                    nightHrs: nightMinutes / 60, weekendHrs: weekendMinutes / 60, holidayHrs: holidayMinutes / 60 
                };
            };

            const handleSaveShift = async () => {
                const rate = parseFloat(rateValue) || settings.defaultRate;
                let start = 0, end = 0, fHours = 8;
                let rawStr = '';
                if (editorType === 'work') {
                    const sh = startHour === '' ? 8 : (parseInt(startHour, 10) || 0);
                    const sm = startMin === '' ? 0 : (parseInt(startMin, 10) || 0);
                    const eh = endHour === '' ? 16 : (parseInt(endHour, 10) || 0);
                    const em = endMin === '' ? 0 : (parseInt(endMin, 10) || 0);
                    start = sh * 60 + sm;
                    end = eh * 60 + em;
                    rawStr = `${String(sh).padStart(2, '0')}:${String(sm).padStart(2, '0')}-${String(eh).padStart(2, '0')}:${String(em).padStart(2, '0')}`;
                } else {
                    fHours = parseFloat(hoursValue);
                    rawStr = `${fHours}h`;
                }
                const details = calculateShiftDetails(start, end, breakValue, rate, editingDate, editorType, fHours);
                await db.collection(`shifts_${activePin}`).doc(editingDate).set({ ...details, raw: rawStr, rate, contractType: shiftContract });
                setEditingDate(null);
                showToast('Směna úspěšně uložena ✓');
            };

            const handleDeleteShift = async () => {
                if (!editingDate) return;
                await db.collection(`shifts_${activePin}`).doc(editingDate).delete();
                setEditingDate(null);
                showToast('Směna byla smazána');
            };

            const handleBulkRateUpdate = async (e) => {
                e.preventDefault();
                const newRate = parseFloat(bulkRate);
                if (isNaN(newRate) || newRate <= 0) return setBulkStatus('Chyba: Zadej platnou číselnou sazbu.');
                setBulkLoading(true); setBulkStatus('Přepočítávám a ukládám...');

                try {
                    const monthPrefix = `${year}-${String(month+1).padStart(2, '0')}`;
                    const targetDates = Object.keys(shifts).filter(dateStr => {
                        if (!dateStr.startsWith(monthPrefix)) return false;
                        const s = shifts[dateStr];
                        if (bulkTypeFilter !== 'all' && s.type !== bulkTypeFilter) return false;
                        if (bulkContractFilter !== 'all' && (s.contractType || 'HPP') !== bulkContractFilter) return false;
                        return true;
                    });

                    if (targetDates.length === 0) { setBulkStatus('Nebyly nalezeny žádné odpovídající směny.'); setBulkLoading(false); return; }

                    const batch = db.batch();
                    targetDates.forEach(dateStr => {
                        const s = shifts[dateStr];
                        let start = 0, end = 0;
                        if (s.type === 'work' && s.raw) {
                            const parts = s.raw.replace(/\s/g, '').split('-');
                            if (parts.length === 2) {
                                const toMin = (t) => { let [h, m] = t.split(':').map(Number); return h * 60 + (isNaN(m) ? 0 : m); };
                                start = toMin(parts[0]); end = toMin(parts[1]);
                            }
                        }
                        const fHours = s.netMinutes / 60;
                        const details = calculateShiftDetails(start, end, s.breakMinutes !== undefined ? s.breakMinutes.toString() : '', newRate, dateStr, s.type, fHours);
                        batch.set(db.collection(`shifts_${activePin}`).doc(dateStr), { ...s, ...details, rate: newRate }, { merge: true });
                    });

                    await batch.commit();
                    setBulkStatus(`Úspěšně upraveno ${targetDates.length} směn.`);
                    showToast(`Sazba změněna u ${targetDates.length} směn ✓`);
                    setTimeout(() => { setShowBulkModal(false); setBulkStatus(''); setBulkRate(''); }, 1200);
                } catch (err) { setBulkStatus('Chyba databáze.'); }
                setBulkLoading(false);
            };

            const monthlyData = useMemo(() => {
                const list = Object.keys(shifts).filter(k => k.startsWith(`${year}-${String(month+1).padStart(2, '0')}`)).sort().map(k => ({ date: k, ...shifts[k] }));
                const groups = { HPP: { gross: 0, hrs: 0, workHrs: 0, base: 0 }, DPČ: { gross: 0, hrs: 0, workHrs: 0, base: 0 }, DPP: { gross: 0, hrs: 0, workHrs: 0, base: 0 } };
                let nB = 0, wB = 0, hB = 0, baseW = 0, sickW = 0, vacW = 0, workHrs = 0;
                let nHrs = 0, wHrs = 0, hHrs = 0;

                let yearlyDPPHrs = 0;
                Object.keys(shifts).forEach(k => {
                    if (k.startsWith(`${year}-`)) {
                        const s = shifts[k];
                        if (s.contractType === 'DPP' && s.type === 'work') yearlyDPPHrs += s.netMinutes / 60;
                    }
                });
                
                list.forEach(s => {
                    const t = s.contractType || 'HPP'; if (!groups[t]) return;
                    groups[t].gross += s.gross; groups[t].hrs += s.netMinutes/60;
                    if (s.type === 'sick') sickW += s.gross;
                    else if (s.type === 'vacation') vacW += s.gross;
                    else { 
                        nB += (s.nBonus||0); wB += (s.wBonus||0); hB += (s.hBonus||0); 
                        nHrs += (s.nightHrs||0); wHrs += (s.weekendHrs||0); hHrs += (s.holidayHrs||0);
                        baseW += (s.base||0); workHrs += (s.netMinutes/60); 
                        groups[t].workHrs += (s.netMinutes/60); groups[t].base += (s.base||0);
                    }
                });

                const monthKey = `${year}-${String(month+1).padStart(2, '0')}`;
                const isUniformDisabledThisMonth = settings.disabledUniformMonths?.[monthKey] === true;
                const isUniformActive = settings.uniformEnabled && !isUniformDisabledThisMonth;
                const activeUniformRate = settings.customUniformRates?.[monthKey] !== undefined ? settings.customUniformRates[monthKey] : (parseFloat(settings.uniformRate) || 0);
                const uniformPay = isUniformActive ? (workHrs * activeUniformRate) : 0;

                let totalSoc = 0, totalZdra = 0, rawTax = 0, totalTaxableGross = 0;
                Object.keys(groups).forEach(t => {
                    const g = groups[t]; if (g.gross <= 0) return; 
                    totalTaxableGross += g.gross;
                    const roundedGrossForTax = Math.ceil(g.gross / 100) * 100;

                    if (t === 'HPP' || (t === 'DPP' && g.gross > 10500) || (t === 'DPČ' && g.gross >= 4000)) { 
                        totalSoc += g.gross * 0.071; totalZdra += g.gross * 0.045; rawTax += roundedGrossForTax * 0.15; 
                    } else rawTax += g.gross * 0.15; 
                });

                const sleva = Number(settings.discounts.taxpayer) + Number(settings.discounts.kids);
                const finalTax = Math.max(0, rawTax - sleva);
                const netWage = totalTaxableGross - totalSoc - totalZdra - finalTax;
                
                return { 
                    list, gross: totalTaxableGross, net: netWage + uniformPay, netWageOnly: netWage, uniformPay, activeUniformRate, isUniformActive,
                    soc: totalSoc, zdra: totalZdra, rawTax: rawTax, appliedDiscount: Math.min(rawTax, sleva), sleva, 
                    bonuses: { night: nB, weekend: wB, holiday: hB, base: baseW, sick: sickW, vacation: vacW, nightHrs: nHrs, weekendHrs: wHrs, holidayHrs: hHrs }, 
                    actualHrs: list.reduce((a,b)=>a+b.netMinutes,0)/60, workedHrsOnly: workHrs, contractGroups: groups, yearlyDPPHrs
                };
            }, [shifts, month, year, settings]);

            // Výpočet odpracovaných hodin a výdělku k dnešnímu dni (pro aktuální nebo rozpracovaný měsíc)
            const toDateData = useMemo(() => {
                const now = new Date();
                const nowYear = now.getFullYear();
                const nowMonth = now.getMonth();
                const nowDay = now.getDate();
                const todayStr = `${nowYear}-${String(nowMonth + 1).padStart(2, '0')}-${String(nowDay).padStart(2, '0')}`;

                const isFutureMonth = (year > nowYear) || (year === nowYear && month > nowMonth);
                const isPastMonth = (year < nowYear) || (year === nowYear && month < nowMonth);

                let listToday = [];
                if (isPastMonth) {
                    listToday = monthlyData.list;
                } else if (isFutureMonth) {
                    listToday = [];
                } else {
                    listToday = monthlyData.list.filter(s => s.date <= todayStr);
                }

                const countToday = listToday.length;
                const workedHrsToday = listToday.filter(s => s.type === 'work').reduce((a, b) => a + b.netMinutes, 0) / 60;
                const actualHrsToday = listToday.reduce((a, b) => a + b.netMinutes, 0) / 60;

                // Výpočet orientační čisté mzdy k dnešku
                const groupsToday = { HPP: { gross: 0 }, DPČ: { gross: 0 }, DPP: { gross: 0 } };
                let grossToday = 0;
                let uniformPayToday = 0;

                listToday.forEach(s => {
                    const t = s.contractType || 'HPP';
                    if (groupsToday[t]) groupsToday[t].gross += s.gross;
                    grossToday += s.gross;
                    if (s.type === 'work' && monthlyData.isUniformActive) {
                        uniformPayToday += (s.netMinutes / 60) * monthlyData.activeUniformRate;
                    }
                });

                let socT = 0, zdraT = 0, rawTaxT = 0;
                Object.keys(groupsToday).forEach(t => {
                    const g = groupsToday[t];
                    if (g.gross <= 0) return;
                    const roundedGross = Math.ceil(g.gross / 100) * 100;
                    if (t === 'HPP' || (t === 'DPP' && g.gross > 10500) || (t === 'DPČ' && g.gross >= 4000)) {
                        socT += g.gross * 0.071;
                        zdraT += g.gross * 0.045;
                        rawTaxT += roundedGross * 0.15;
                    } else {
                        rawTaxT += g.gross * 0.15;
                    }
                });
                const finalTaxT = Math.max(0, rawTaxT - monthlyData.sleva);
                const netWageToday = Math.max(0, grossToday - socT - zdraT - finalTaxT);
                const totalNetToday = netWageToday + uniformPayToday;

                return {
                    countToday,
                    workedHrsToday,
                    actualHrsToday,
                    netToday: totalNetToday,
                    grossToday,
                    isFutureMonth,
                    isPastMonth
                };
            }, [monthlyData, year, month]);

            // Copy Payslip Summary with Day-by-Day Shift Breakdown to Clipboard
            const handleCopySummary = () => {
                const monthName = new Intl.DateTimeFormat('cs-CZ', { month: 'long', year: 'numeric' }).format(currentDate);
                
                let shiftsBreakdown = '';
                if (monthlyData.list.length === 0) {
                    shiftsBreakdown = '• Žádné zapsané směny v tomto měsíci';
                } else {
                    shiftsBreakdown = monthlyData.list.map(s => {
                        const d = new Date(s.date);
                        const dayName = new Intl.DateTimeFormat('cs-CZ', { weekday: 'short' }).format(d);
                        const dateFormatted = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;
                        const typeLabel = s.type === 'vacation' ? 'Dovolená' : s.type === 'sick' ? 'Nemoc' : (s.raw || 'Směna');
                        const uniformItem = (s.type === 'work' && monthlyData.isUniformActive) ? (s.netMinutes / 60) * monthlyData.activeUniformRate : 0;
                        const shiftGross = Math.round(s.gross + uniformItem);
                        return `• ${dayName} ${dateFormatted}: ${typeLabel} (${formatHrs(s.netMinutes)}) – ${shiftGross.toLocaleString('cs-CZ')} Kč [${s.contractType || 'HPP'}]`;
                    }).join('\n');
                }

                const text = `📊 WageTracker – Přehled za ${monthName}
👤 Uživatel: ${profileName || 'Uživatel'}
══════════════════════════════════════
📅 ROZPIS JEDNOTLIVÝCH SMĚN:
${shiftsBreakdown}
══════════════════════════════════════
⏱ Celkem směn: ${monthlyData.list.length}
⏱ Celkem hodin: ${formatHrs(monthlyData.actualHrs * 60)} (práce: ${formatHrs(monthlyData.workedHrsOnly * 60)})
💰 Hrubá mzda: ${Math.round(monthlyData.gross).toLocaleString('cs-CZ')} Kč
🛡 Odvody celkem: -${Math.round(monthlyData.soc + monthlyData.zdra + Math.max(0, monthlyData.rawTax - monthlyData.appliedDiscount)).toLocaleString('cs-CZ')} Kč
💵 Čistá mzda: ${Math.round(monthlyData.netWageOnly).toLocaleString('cs-CZ')} Kč
${monthlyData.isUniformActive && monthlyData.uniformPay > 0 ? `👕 Osvobozeno (uniforma): +${Math.round(monthlyData.uniformPay).toLocaleString('cs-CZ')} Kč\n` : ''}══════════════════════════════════════
💳 CELKEM K VÝPLATĚ: ${Math.round(monthlyData.net).toLocaleString('cs-CZ')} Kč`;

                navigator.clipboard.writeText(text).then(() => {
                    showToast('Detailní rozpis směn zkopírován do schránky! 📋');
                }).catch(() => {
                    showToast('Nepodařilo se zkopírovat.');
                });
            };

            const openEditor = (dateStr) => {
                const s = shifts[dateStr]; setEditingDate(dateStr);
                if (s) { 
                    setEditorType(s.type || 'work'); setBreakValue(s.breakMinutes?.toString() || ''); 
                    setHoursValue(s.type !== 'work' ? (s.netMinutes/60).toString() : '8'); 
                    setRateValue(s.rate); setShiftContract(s.contractType || settings.defaultContract); 

                    let sh = '', sm = '', eh = '', em = '';
                    if (s.type === 'work' && s.raw) {
                        const parts = s.raw.replace(/\s/g, '').split('-');
                        if (parts.length === 2) {
                            const p1 = parts[0].split(':'); sh = p1[0] ? p1[0].padStart(2, '0') : ''; sm = p1[1] ? p1[1].padStart(2, '0') : '';
                            const p2 = parts[1].split(':'); eh = p2[0] ? p2[0].padStart(2, '0') : ''; em = p2[1] ? p2[1].padStart(2, '0') : '';
                        }
                    }
                    setStartHour(sh); setStartMin(sm); setEndHour(eh); setEndMin(em);
                }
                else { 
                    setEditorType('work'); setStartHour(''); setStartMin(''); setEndHour(''); setEndMin('');
                    setBreakValue(''); setRateValue(settings.defaultRate); setShiftContract(settings.defaultContract); 
                }
            };

            const applyPreset = (preset) => {
                setStartHour(preset.sh);
                setStartMin(preset.sm);
                setEndHour(preset.eh);
                setEndMin(preset.em);
                setBreakValue(preset.brk);
                showToast(`Nastavena ${preset.label} směna`);
            };

            const handleTouchStart = (e) => { 
                touchStartX.current = e.targetTouches[0].clientX; 
                touchStartY.current = e.targetTouches[0].clientY; 
                touchEndX.current = e.targetTouches[0].clientX; 
                touchEndY.current = e.targetTouches[0].clientY; 
            };
            const handleTouchMove = (e) => { 
                touchEndX.current = e.targetTouches[0].clientX; 
                touchEndY.current = e.targetTouches[0].clientY; 
            };
            const handleTouchEnd = () => {
                const diffX = touchStartX.current - touchEndX.current; 
                const diffY = touchStartY.current - touchEndY.current;
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
                    if (diffX > 0) setCurrentDate(new Date(year, month + 1, 1)); 
                    else setCurrentDate(new Date(year, month - 1, 1));
                }
                touchStartX.current = 0; touchEndX.current = 0; touchStartY.current = 0; touchEndY.current = 0;
            };
            
            const displayStart = startHour + startMin;
            let formattedStart = displayStart;
            if (displayStart.length >= 3) {
                formattedStart = displayStart.slice(0, 2) + ':' + displayStart.slice(2);
            }
            
            const displayEnd = endHour + endMin;
            let formattedEnd = displayEnd;
            if (displayEnd.length >= 3) {
                formattedEnd = displayEnd.slice(0, 2) + ':' + displayEnd.slice(2);
            }

            if (isInitializing) return (
                <div className="min-h-screen flex flex-col items-center justify-center dark:bg-slate-950 transition-colors duration-500">
                    <div className="w-16 h-16 bg-blue-50 dark:bg-slate-900 rounded-3xl flex items-center justify-center mb-4 shadow-sm">
                        <i className="fa-solid fa-wallet text-2xl text-blue-600 animate-pulse"></i>
                    </div>
                    <h2 className="text-xl font-black text-slate-800 dark:text-white italic tracking-tight">WageTracker</h2>
                    <p className="text-xs text-slate-400 font-semibold mt-1">Načítám tvá data...</p>
                </div>
            );

            if (!activePin || globalError) return <AuthScreen onLoginSuccess={handleLoginSuccess} globalError={globalError} />;

            return (
                <div className="max-w-md mx-auto min-h-screen p-4 pb-32 animate-fade-in">
                    <Toast message={toastMessage} />

                    {/* --- App Header --- */}
                    <header className="flex justify-between items-center mb-4 pt-1 px-1">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-2xl text-white shadow-md shadow-blue-500/20 w-11 h-11 flex items-center justify-center">
                                <i className="fa-solid fa-wallet text-lg"></i>
                            </div>
                            <div>
                                <h1 className="text-lg font-black italic tracking-tight text-slate-900 dark:text-white leading-tight">WageTracker</h1>
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                                    {profileName ? `Ahoj, ${profileName.split(' ')[0]}` : 'Moje výplata'}
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => setActiveTab('settings')} 
                                className={`w-10 h-10 rounded-2xl flex items-center justify-center border transition-all active:scale-90 ${activeTab === 'settings' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/25' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200/80 dark:border-slate-800/80 shadow-sm'}`}
                                title="Nastavení"
                            >
                                <i className="fa-solid fa-gear text-sm"></i>
                            </button>
                        </div>
                    </header>

                    {/* --- CALENDAR TAB --- */}
                    {activeTab === 'calendar' && (
                        <div className="space-y-3.5 animate-fade-in">
                            {/* Navigation Bar with Month Picker & "Dnes" button */}
                            <div className="flex items-center justify-between bg-white dark:bg-slate-900 px-3 py-2.5 rounded-2xl border border-slate-200/70 dark:border-slate-800/80 shadow-sm">
                                <button 
                                    onClick={() => setCurrentDate(new Date(year, month - 1, 1))} 
                                    className="w-9 h-9 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all"
                                >
                                    <i className="fa-solid fa-chevron-left text-sm"></i>
                                </button>
                                
                                <div className="flex items-center gap-2">
                                    <span className="font-extrabold text-sm uppercase tracking-wide text-slate-800 dark:text-slate-100">

                    {editingDate && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end justify-center sm:items-center sm:p-4 animate-fade-in">
                            <div className="bg-white dark:bg-slate-950 w-full sm:max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 shadow-2xl flex flex-col max-h-[92vh] animate-slide-up border-t border-slate-100 dark:border-slate-800 pb-safe">
                                
                                {/* Bottom sheet handle */}
                                <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mb-4 sm:hidden"></div>

                                <div className="flex justify-between items-center mb-5">
                                    <div>
                                        <h3 className="font-black text-lg capitalize text-slate-900 dark:text-white">
                                            {new Intl.DateTimeFormat('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(editingDate))}
                                        </h3>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">Záznam dne</p>
                                    </div>
                                    <button 
                                        onClick={() => setEditingDate(null)} 
                                        className="w-9 h-9 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-500 active:scale-90 transition-transform"
                                    >
                                        <i className="fa-solid fa-xmark text-sm"></i>
                                    </button>
                                </div>

                                {/* Segmented control: Směna / Dovolená / Nemocenská */}
                                <div className="relative flex bg-slate-100 dark:bg-slate-900 p-1.5 rounded-2xl mb-5">
                                    <div className={`absolute top-1.5 bottom-1.5 w-[calc(33.33%-4px)] bg-white dark:bg-slate-800 rounded-xl shadow-sm transition-all duration-300 ease-out ${
                                        editorType === 'work' ? 'left-1.5' : 
                                        editorType === 'vacation' ? 'left-[calc(33.33%+2px)]' : 
                                        'left-[calc(66.66%+2px)]'
                                    }`}></div>
                                    <button 
                                        onClick={() => setEditorType('work')} 
                                        className={`relative z-10 flex-1 py-2 rounded-xl text-xs font-bold transition-colors duration-200 ${editorType === 'work' ? 'text-blue-600 dark:text-blue-400' : 'text-slate-500'}`}
                                    >
                                        SMĚNA
                                    </button>
                                    <button 
                                        onClick={() => { setEditorType('vacation'); setHoursValue('8'); }} 
                                        className={`relative z-10 flex-1 py-2 rounded-xl text-xs font-bold transition-colors duration-200 ${editorType === 'vacation' ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500'}`}
                                    >
                                        DOVOLENÁ
                                    </button>
                                    <button 
                                        onClick={() => { setEditorType('sick'); setHoursValue('8'); }} 
                                        className={`relative z-10 flex-1 py-2 rounded-xl text-xs font-bold transition-colors duration-200 ${editorType === 'sick' ? 'text-orange-600 dark:text-orange-400' : 'text-slate-500'}`}
                                    >
                                        NEMOC
                                    </button>
                                </div>

                                <div className="space-y-4 overflow-y-auto pb-2 px-1">
                                    {editorType === 'work' ? (
                                        <>
                                            {/* Quick Shift Presets Bar */}
                                            <div>
                                                <div className="flex justify-between items-center mb-1.5">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">
                                                        {smartPresets[0]?.isDynamic ? 'Chytré předvolby (z tvých směn)' : 'Rychlé předvolby'}
                                                    </label>
                                                    {lastShiftBeforeEditing && (
                                                        <button
                                                            type="button"
                                                            onClick={() => {
                                                                const raw = lastShiftBeforeEditing.shift.raw;
                                                                if (raw && raw.includes('-')) {
                                                                    const parts = raw.split('-');
                                                                    const p1 = parts[0].split(':');
                                                                    const p2 = parts[1].split(':');
                                                                    setStartHour(p1[0].padStart(2, '0'));
                                                                    setStartMin((p1[1] || '00').padStart(2, '0'));
                                                                    setEndHour(p2[0].padStart(2, '0'));
                                                                    setEndMin((p2[1] || '00').padStart(2, '0'));
                                                                    setBreakValue(lastShiftBeforeEditing.shift.breakMinutes !== undefined ? lastShiftBeforeEditing.shift.breakMinutes.toString() : '30');
                                                                    if (lastShiftBeforeEditing.shift.rate) setRateValue(lastShiftBeforeEditing.shift.rate);
                                                                    if (lastShiftBeforeEditing.shift.contractType) setShiftContract(lastShiftBeforeEditing.shift.contractType);
                                                                    showToast(`Zkopírována předchozí směna (${raw})`);
                                                                }
                                                            }}
                                                            className="text-[10px] font-bold text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1 active:scale-95 transition-all"
                                                        >
                                                            <i className="fa-solid fa-rotate-left text-[9px]"></i> Zopakovat poslední ({lastShiftBeforeEditing.shift.raw})
                                                        </button>
                                                    )}
                                                </div>
                                                <div className="flex gap-1.5 overflow-x-auto pb-1">
                                                    {smartPresets.map(preset => (
                                                        <button
                                                            key={preset.label}
                                                            type="button"
                                                            onClick={() => applyPreset(preset)}
                                                            className="flex-shrink-0 px-2.5 py-1.5 bg-slate-100 hover:bg-blue-50 dark:bg-slate-900 dark:hover:bg-blue-950/40 text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 rounded-xl text-[11px] font-bold border border-slate-200/60 dark:border-slate-800 transition-all active:scale-95 flex items-center gap-1.5"
                                                        >
                                                            <span>{preset.label}</span>
                                                            {preset.count && preset.count > 1 && (
                                                                <span className="text-[9px] bg-slate-200 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-1 rounded-md font-extrabold">
                                                                    {preset.count}×
                                                                </span>
                                                            )}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Time range picker */}
                                            <div className="text-center bg-slate-50 dark:bg-slate-900/60 p-4 rounded-3xl border border-slate-200/70 dark:border-slate-800">
                                                <label className="text-[10px] font-bold text-slate-400 block mb-3 uppercase tracking-wider">Začátek a konec směny</label>
                                                <div className="flex items-center justify-center gap-3">
                                                    <div className="bg-white dark:bg-slate-900 px-3.5 py-2.5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800">
                                                        <input 
                                                            type="text" 
                                                            inputMode="numeric" 
                                                            pattern="[0-9]*" 
                                                            maxLength={5} 
                                                            value={formattedStart} 
                                                            onFocus={e => e.target.select()}
                                                            onChange={e => {
                                                                const val = e.target.value.replace(/\D/g, '');
                                                                if (val.length === 0) { setStartHour(''); setStartMin(''); }
                                                                else if (val.length <= 2) {
                                                                    if (parseInt(val, 10) > 23) return;
                                                                    setStartHour(val); setStartMin('');
                                                                }
                                                                else if (val.length <= 4) {
                                                                    const h = val.slice(0, 2); const m = val.slice(2, 4);
                                                                    if (parseInt(m, 10) > 59) return;
                                                                    setStartHour(h); setStartMin(m);
                                                                }
                                                            }} 
                                                            className="w-20 text-center text-2xl font-black bg-transparent outline-none text-slate-800 dark:text-slate-100 tracking-wider" 
                                                            placeholder="00:00" 
                                                        />
                                                    </div>

                                                    <i className="fa-solid fa-arrow-right-long text-slate-300 dark:text-slate-600 text-sm"></i>

                                                    <div className="bg-white dark:bg-slate-900 px-3.5 py-2.5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800">
                                                        <input 
                                                            type="text" 
                                                            inputMode="numeric" 
                                                            pattern="[0-9]*" 
                                                            maxLength={5} 
                                                            value={formattedEnd} 
                                                            onFocus={e => e.target.select()}
                                                            onChange={e => {
                                                                const val = e.target.value.replace(/\D/g, '');
                                                                if (val.length === 0) { setEndHour(''); setEndMin(''); }
                                                                else if (val.length <= 2) {
                                                                    if (parseInt(val, 10) > 23) return;
                                                                    setEndHour(val); setEndMin('');
                                                                }
                                                                else if (val.length <= 4) {
                                                                    const h = val.slice(0, 2); const m = val.slice(2, 4);
                                                                    if (parseInt(m, 10) > 59) return;
                                                                    setEndHour(h); setEndMin(m);
                                                                }
                                                            }} 
                                                            className="w-20 text-center text-2xl font-black bg-transparent outline-none text-slate-800 dark:text-slate-100 tracking-wider" 
                                                            placeholder="00:00" 
                                                        />
                                                    </div>
                                                </div>

                                                {liveDuration ? (
                                                    <div className="mt-3.5 inline-flex items-center gap-2 bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 py-2 px-4 rounded-xl font-bold text-xs border border-blue-200/60 dark:border-blue-900/50">
                                                        <i className="fa-regular fa-clock text-sm"></i>
                                                        <span>Čistý čas: {liveDuration.netHours}h {String(liveDuration.netMins).padStart(2, '0')}m</span>
                                                        <span className="text-[10px] text-slate-400 pl-1.5 border-l border-blue-200 dark:border-blue-900/60 font-semibold">
                                                            pauza {liveDuration.breakMins}m
                                                        </span>
                                                    </div>
                                                ) : (
                                                    <div className="mt-3 text-[11px] text-slate-400 font-medium">Zadejte čas začátku a konce</div>
                                                )}
                                            </div>

                                            {/* Pauza & Hodinová sazba */}
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-wider">Pauza (min)</label>
                                                    <div className="relative">
                                                        <i className="fa-solid fa-mug-hot absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                                        <input 
                                                            type="number" 
                                                            value={breakValue} 
                                                            onChange={e => setBreakValue(e.target.value)} 
                                                            placeholder="Auto (30)" 
                                                            className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 pl-10 font-bold text-xs outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white" 
                                                        />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-wider">Sazba (Kč/h)</label>
                                                    <div className="relative">
                                                        <i className="fa-solid fa-coins absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                                        <input 
                                                            type="number" 
                                                            value={rateValue} 
                                                            onChange={e => setRateValue(e.target.value)} 
                                                            placeholder={settings.defaultRate} 
                                                            className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 pl-10 font-bold text-xs outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white" 
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        </>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-wider">Počet hodin</label>
                                                <div className="relative">
                                                    <i className="fa-regular fa-clock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                                    <input 
                                                        type="number" 
                                                        step="0.5" 
                                                        value={hoursValue} 
                                                        onChange={e => setHoursValue(e.target.value)} 
                                                        className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 pl-10 font-bold text-xs outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white" 
                                                    />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-wider">Sazba (Kč/h)</label>
                                                <div className="relative">
                                                    <i className="fa-solid fa-coins absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                                    <input 
                                                        type="number" 
                                                        value={rateValue} 
                                                        onChange={e => setRateValue(e.target.value)} 
                                                        placeholder={settings.defaultRate} 
                                                        className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 pl-10 font-bold text-xs outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white" 
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Typ smlouvy */}
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-wider">Typ smlouvy</label>
                                        <div className="relative bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
                                            <i className="fa-solid fa-file-signature absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 z-10 pointer-events-none text-xs"></i>
                                            <i className="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 z-10 pointer-events-none text-xs"></i>
                                            <select 
                                                value={shiftContract} 
                                                onChange={e => setShiftContract(e.target.value)} 
                                                className="w-full bg-transparent p-3.5 pl-10 pr-10 font-bold text-xs outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white appearance-none cursor-pointer"
                                            >
                                                {Object.keys(contractLabels).map(k => <option key={k} value={k} className="bg-white dark:bg-slate-900">{contractLabels[k]}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                {/* Modal Actions */}
                                <div className="flex gap-2.5 mt-4 pt-3 border-t border-slate-100 dark:border-slate-800/60">
                                    {shifts[editingDate] && (
                                        <button 
                                            onClick={handleDeleteShift} 
                                            className="p-3.5 bg-rose-50 dark:bg-rose-950/30 text-rose-500 rounded-2xl active:scale-90 transition-transform aspect-square flex items-center justify-center border border-rose-200/50 dark:border-rose-900/30"
                                            title="Smazat směnu"
                                        >
                                            <i className="fa-solid fa-trash text-sm"></i>
                                        </button>
                                    )}
                                    <button 
                                        onClick={handleSaveShift} 
                                        className="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-500/25 active:scale-95 transition-all flex items-center justify-center gap-2 text-xs uppercase tracking-wider"
                                    >
                                        <i className="fa-solid fa-check text-sm"></i> Uložit směnu
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- BULK RATE CHANGE MODAL --- */}
                    {showBulkModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end justify-center sm:items-center sm:p-4 animate-fade-in">
                            <form onSubmit={handleBulkRateUpdate} className="bg-white dark:bg-slate-950 w-full sm:max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 shadow-2xl flex flex-col max-h-[92vh] animate-slide-up pb-safe">
                                <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mb-4 sm:hidden"></div>

                                <div className="flex justify-between items-center mb-5">
                                    <div>
                                        <h3 className="font-black text-lg text-slate-900 dark:text-white">Hromadná změna sazeb</h3>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">Uplatnit na tento měsíc</p>
                                    </div>
                                    <button 
                                        type="button" 
                                        onClick={() => { setShowBulkModal(false); setBulkStatus(''); }} 
                                        className="w-9 h-9 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-500 active:scale-90 transition-transform"
                                    >
                                        <i className="fa-solid fa-xmark text-sm"></i>
                                    </button>
                                </div>
                                <div className="space-y-3.5">
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-wider">Nová hodinová sazba</label>
                                        <div className="relative">
                                            <i className="fa-solid fa-coins absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                            <input 
                                                type="number" 
                                                required 
                                                value={bulkRate} 
                                                onChange={e => setBulkRate(e.target.value)} 
                                                placeholder="Nová sazba (např. 180)" 
                                                className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 pl-10 font-bold text-xs outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white" 
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-wider">Filtrovat typ směny</label>
                                        <select 
                                            value={bulkTypeFilter} 
                                            onChange={e => setBulkTypeFilter(e.target.value)} 
                                            className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 font-bold text-xs outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white"
                                        >
                                            <option value="all">Všechny (Práce, Dovolená, Nemoc)</option>
                                            <option value="work">Pouze odpracovaná práce</option>
                                            <option value="vacation">Pouze dovolená</option>
                                            <option value="sick">Pouze nemocenská</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-wider">Filtrovat podle smlouvy</label>
                                        <select 
                                            value={bulkContractFilter} 
                                            onChange={e => setBulkContractFilter(e.target.value)} 
                                            className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 font-bold text-xs outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white"
                                        >
                                            <option value="all">Všechny smlouvy</option>
                                            <option value="HPP">Pouze Pracovní poměr (HPP)</option>
                                            <option value="DPČ">Pouze Dohoda DPČ</option>
                                            <option value="DPP">Pouze Dohoda DPP</option>
                                        </select>
                                    </div>
                                    {bulkStatus && (
                                        <div className="p-3 bg-blue-50 dark:bg-slate-900/50 rounded-xl text-center text-xs font-bold text-blue-600 dark:text-blue-400 border border-blue-200/50">
                                            {bulkStatus}
                                        </div>
                                    )}
                                </div>
                                <div className="flex gap-2.5 mt-5 pt-3 border-t border-slate-100 dark:border-slate-800/60">
                                    <button 
                                        type="button" 
                                        onClick={() => { setShowBulkModal(false); setBulkStatus(''); }} 
                                        className="flex-1 py-3.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold rounded-2xl active:scale-95 transition-transform text-xs"
                                    >
                                        Zrušit
                                    </button>
                                    <button 
                                        type="submit" 
                                        disabled={bulkLoading} 
                                        className="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-500/25 active:scale-95 transition-transform flex items-center justify-center gap-2 text-xs uppercase tracking-wider"
                                    >
                                        {bulkLoading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-bolt"></i>} Uplatnit
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
