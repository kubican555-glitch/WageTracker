                    const shiftsOnDay = mList.filter(s => {
                        const dStr = s.dateStr || s.date;
                        if (!dStr) return false;
                        const d = new Date(dStr + 'T00:00:00');
                        return d.getDay() === dayIdx;
                    });
                    const shiftsCount = shiftsOnDay.length;
                    const hoursTotal = shiftsOnDay.reduce((acc, s) => acc + (s.netMinutes / 60), 0);
                    const grossTotal = shiftsOnDay.reduce((acc, s) => acc + s.gross, 0);
                    // Odhad čisté mzdy pro směny tohoto dne
                    const netEstimate = shiftsOnDay.reduce((acc, s) => {
                        const isHpp = s.contractType === 'HPP';
                        const ratio = isHpp ? 0.81 : (s.contractType === 'DPP' ? 0.85 : 0.79);
                        const uniformPart = monthlyData.isUniformActive ? (s.netMinutes / 60) * monthlyData.activeUniformRate : 0;
                        return acc + ((s.gross * ratio) + uniformPart);
                    }, 0);
                    const avgRate = hoursTotal > 0 ? (grossTotal / hoursTotal) : 0;
                    const avgNetPerShift = shiftsCount > 0 ? (netEstimate / shiftsCount) : 0;

                    return {
                        dayIdx,
                        shortName: weekdayNames[dayIdx],
                        fullName: weekdayFullNames[dayIdx],
                        shiftsCount,
                        hoursTotal,
                        grossTotal,
                        netEstimate,
                        avgRate,
                        avgNetPerShift,
                        isWeekend: [0, 6].includes(dayIdx)
                    };
                });

                const maxDayShifts = Math.max(1, ...dayStats.map(d => d.shiftsCount));
                const activeDayStats = dayStats.filter(d => d.shiftsCount > 0);
                const mostLucrativeDay = activeDayStats.length > 0
                    ? [...activeDayStats].sort((a, b) => b.avgRate - a.avgRate)[0]
                    : null;
                const busiestDay = activeDayStats.length > 0
                    ? [...activeDayStats].sort((a, b) => b.shiftsCount - a.shiftsCount)[0]
                    : null;

                return {
                    daysInMonth,
                    workDaysCount,
                    offDaysCount,
                    workDaysPct,
                    offDaysPct,
                    avgShiftHours,
                    avgShiftNet,
                    nightHoursTotal,
                    dayHoursTotal,
                    nightHoursPct,
                    dayHoursPct,
                    dayStats,
                    maxDayShifts,
                    mostLucrativeDay,
                    busiestDay
                };
            }, [year, month, monthlyData, settings]);

            // Heatmapa výdělků: denní mapování čistého výdělku
            // Pomocná funkce pro výpočet denního výdělku
            const getShiftEarnings = (s, dateStr) => {
                if (!s) return { net: 0, gross: 0, hours: 0, type: 'off', label: 'Volno' };
                const dObj = new Date(dateStr + 'T00:00:00');
                const mKey = `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}`;
                const isUniformActive = settings.uniformEnabled && !(settings.disabledUniformMonths?.[mKey] === true);
                const activeUniformRate = settings.customUniformRates?.[mKey] !== undefined ? settings.customUniformRates[mKey] : (parseFloat(settings.uniformRate) || 0);
                const uniformPay = (s.type === 'work' && isUniformActive) ? (s.netMinutes / 60) * activeUniformRate : 0;
                
                // Odhad orientačního čistého výdělku směny
                const contract = s.contractType || 'HPP';
                let soc = 0, zdra = 0, tax = 0;
                if (contract === 'HPP' || (contract === 'DPP' && s.gross > 10500) || (contract === 'DPČ' && s.gross >= 4000)) {
                    soc = s.gross * 0.071;
                    zdra = s.gross * 0.045;
                    tax = Math.ceil(s.gross / 100) * 100 * 0.15;
                } else {
                    tax = s.gross * 0.15;
                }
                const net = Math.max(0, s.gross - soc - zdra - tax) + uniformPay;
                return {
                    net: Math.round(net),
                    gross: Math.round(s.gross),
                    hours: s.netMinutes / 60,
                    type: s.type || 'work',
                    contract: contract,
                    uniformPay: Math.round(uniformPay),
                    raw: s.raw || ''
                };
            };

            // 1. Měsíční heatmap data (mřížka pro aktuální měsíc s offsetem dnů v týdnu)
            const monthHeatmapData = useMemo(() => {
                const days = [];
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const s = shifts[dateStr];
                    const earnings = getShiftEarnings(s, dateStr);
                    days.push({
                        day: d,
                        dateStr,
                        hasShift: Boolean(s),
                        ...earnings
                    });
                }
                return days;
            }, [shifts, year, month, daysInMonth, settings]);

            // 2. Roční heatmap data (kompaktní matice 52 týdnů)
            const yearHeatmapWeeks = useMemo(() => {
                const startDate = new Date(year, 0, 1);
                // Nastavíme na pondělí prvního týdne
                const dayOfWeek = (startDate.getDay() + 6) % 7; // Po = 0
                const current = new Date(startDate);
                current.setDate(startDate.getDate() - dayOfWeek);

                const endDate = new Date(year, 11, 31);
                const weeks = [];
                let currentWeek = [];

                while (current <= endDate || currentWeek.length > 0) {
                    const cYear = current.getFullYear();
                    const cMonth = current.getMonth();
                    const cDay = current.getDate();
                    const dateStr = `${cYear}-${String(cMonth + 1).padStart(2, '0')}-${String(cDay).padStart(2, '0')}`;
                    const isCurrentYear = cYear === year;
                    const s = isCurrentYear ? shifts[dateStr] : null;
                    const earnings = isCurrentYear ? getShiftEarnings(s, dateStr) : { net: 0, hours: 0, hasShift: false };

                    currentWeek.push({
                        dateStr,
                        day: cDay,
                        month: cMonth,
                        isCurrentYear,
                        hasShift: Boolean(s),
                        ...earnings
                    });

                    if (currentWeek.length === 7) {
                        weeks.push(currentWeek);
                        currentWeek = [];
                        if (current > endDate) break;
                    }

                    current.setDate(current.getDate() + 1);
                }

                return weeks;
            }, [shifts, year, settings]);

            // Výpočet odpracovaných hodin a výdělku k dnešnímu dni (pro aktuální nebo rozpracovaný měsíc)
            const toDateData = useMemo(() => {
                const now = new Date();
                const nowYear = now.getFullYear();
                const nowMonth = now.getMonth();
                const nowDay = now.getDate();
                const todayStr = `${nowYear}-${String(nowMonth + 1).padStart(2, '0')}-${String(nowDay).padStart(2, '0')}`;

                const isFutureMonth = (year > nowYear) || (year === nowYear && month > nowMonth);
                const isPastMonth = (year < nowYear) || (year === nowYear && month < nowMonth);

                let listToday = [];
                if (isPastMonth) {
                    listToday = monthlyData.list;
                } else if (isFutureMonth) {
                    listToday = [];
                } else {
                    listToday = monthlyData.list.filter(s => s.date <= todayStr);
                }

                const countToday = listToday.length;
                const workedHrsToday = listToday.filter(s => s.type === 'work').reduce((a, b) => a + b.netMinutes, 0) / 60;
                const actualHrsToday = listToday.reduce((a, b) => a + b.netMinutes, 0) / 60;

                // Výpočet orientační čisté mzdy k dnešku
                const groupsToday = { HPP: { gross: 0 }, DPČ: { gross: 0 }, DPP: { gross: 0 } };
                let grossToday = 0;
                let uniformPayToday = 0;

                listToday.forEach(s => {
                    const t = s.contractType || 'HPP';
                    if (groupsToday[t]) groupsToday[t].gross += s.gross;
                    grossToday += s.gross;
                    if (s.type === 'work' && monthlyData.isUniformActive) {
                        uniformPayToday += (s.netMinutes / 60) * monthlyData.activeUniformRate;
                    }
                });

                let socT = 0, zdraT = 0, rawTaxT = 0;
                Object.keys(groupsToday).forEach(t => {
                    const g = groupsToday[t];
                    if (g.gross <= 0) return;
                    const roundedGross = Math.ceil(g.gross / 100) * 100;
                    if (t === 'HPP' || (t === 'DPP' && g.gross > 10500) || (t === 'DPČ' && g.gross >= 4000)) {
                        socT += g.gross * 0.071;
                        zdraT += g.gross * 0.045;
                        rawTaxT += roundedGross * 0.15;
                    } else {
                        rawTaxT += g.gross * 0.15;
                    }
                });
                const finalTaxT = Math.max(0, rawTaxT - monthlyData.sleva);
                const netWageToday = Math.max(0, grossToday - socT - zdraT - finalTaxT);
                const totalNetToday = netWageToday + uniformPayToday;

                return {
                    countToday,
                    workedHrsToday,
                    actualHrsToday,
                    netToday: totalNetToday,
                    grossToday,
                    isFutureMonth,
                    isPastMonth
                };
            }, [monthlyData, year, month]);

            // Seskupení směn v měsíci podle kalendářních týdnů s mezisoučty
            const weeklyGroups = useMemo(() => {
                const groupsMap = new Map();
                const todayDateObj = new Date(todayStr + 'T00:00:00');
                const todayTime = todayDateObj.getTime();

                if (!settings.showOffDaysInList) {
                    if (!monthlyData.list || monthlyData.list.length === 0) return [];

                    monthlyData.list.forEach(s => {
                        const d = new Date(s.date + 'T00:00:00');
                        const dayOfWeek = (d.getDay() + 6) % 7; // Po = 0 ... Ne = 6
                        const mon = new Date(d);
                        mon.setDate(d.getDate() - dayOfWeek);
                        const sun = new Date(mon);
                        sun.setDate(mon.getDate() + 6);

                        // ISO číslo týdne
                        const temp = new Date(d.valueOf());
                        temp.setDate(temp.getDate() - dayOfWeek + 3);
                        const firstThu = temp.valueOf();
                        temp.setMonth(0, 1);
                        if (temp.getDay() !== 4) temp.setMonth(0, 1 + ((4 - temp.getDay()) + 7) % 7);
                        const weekNum = 1 + Math.ceil((firstThu - temp) / 604800000);

                        const weekKey = `${mon.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
                        if (!groupsMap.has(weekKey)) {
                            const monStart = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()).getTime();
                            const sunEnd = new Date(sun.getFullYear(), sun.getMonth(), sun.getDate(), 23, 59, 59).getTime();
                            groupsMap.set(weekKey, {
                                weekKey,
                                weekNum,
                                mon,
                                sun,
                                isCurrentWeek: todayTime >= monStart && todayTime <= sunEnd,
                                days: [],
                                totalMinutes: 0,
                                totalGross: 0,
                                shiftCount: 0
                            });
                        }
                        const group = groupsMap.get(weekKey);
                        group.days.push({ ...s, isOffDay: false });
                        group.totalMinutes += s.netMinutes;
                        const shiftUniformPay = (s.type === 'work' && monthlyData.isUniformActive) ? (s.netMinutes / 60) * monthlyData.activeUniformRate : 0;
                        group.totalGross += (s.gross + shiftUniformPay);
                        group.shiftCount += 1;
                    });
                } else {
                    for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
                        const ds = `${year}-${String(month+1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                        const d = new Date(year, month, dayNum);
                        const dayOfWeek = (d.getDay() + 6) % 7;
                        const mon = new Date(year, month, dayNum);
                        mon.setDate(dayNum - dayOfWeek);
                        const sun = new Date(mon);
                        sun.setDate(mon.getDate() + 6);

                        const temp = new Date(d.valueOf());
                        temp.setDate(temp.getDate() - dayOfWeek + 3);
                        const firstThu = temp.valueOf();
                        temp.setMonth(0, 1);
                        if (temp.getDay() !== 4) temp.setMonth(0, 1 + ((4 - temp.getDay()) + 7) % 7);
                        const weekNum = 1 + Math.ceil((firstThu - temp) / 604800000);

                        const weekKey = `${mon.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
                        if (!groupsMap.has(weekKey)) {
                            const monStart = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()).getTime();
                            const sunEnd = new Date(sun.getFullYear(), sun.getMonth(), sun.getDate(), 23, 59, 59).getTime();
                            groupsMap.set(weekKey, {
                                weekKey,
                                weekNum,
                                mon,
                                sun,
                                isCurrentWeek: todayTime >= monStart && todayTime <= sunEnd,
                                days: [],
                                totalMinutes: 0,
                                totalGross: 0,
                                shiftCount: 0
                            });
                        }
                        const group = groupsMap.get(weekKey);
                        const s = shifts[ds];
                        if (s) {
                            group.days.push({ ...s, date: ds, isOffDay: false });
                            group.totalMinutes += s.netMinutes;
                            const shiftUniformPay = (s.type === 'work' && monthlyData.isUniformActive) ? (s.netMinutes / 60) * monthlyData.activeUniformRate : 0;
                            group.totalGross += (s.gross + shiftUniformPay);
                            group.shiftCount += 1;
                        } else {
                            group.days.push({ date: ds, isOffDay: true });
                        }
                    }
                }

                groupsMap.forEach(group => {
                    group.shifts = group.days;
                });

                return Array.from(groupsMap.values());
            }, [monthlyData.list, monthlyData.isUniformActive, monthlyData.activeUniformRate, settings.showOffDaysInList, daysInMonth, year, month, shifts, todayStr]);

            const isWeekCollapsedDefault = (wg) => {
                if (isViewingCurrentMonth && wg.isCurrentWeek) return false;
                return true;
            };

            const toggleWeekCollapse = (weekKey) => {
                setCollapsedWeeks(prev => {
                    const wg = weeklyGroups.find(g => g.weekKey === weekKey);
                    const currentIsCollapsed = prev[weekKey] !== undefined ? prev[weekKey] : (wg ? isWeekCollapsedDefault(wg) : true);
                    return {
                        ...prev,
                        [weekKey]: !currentIsCollapsed
                    };
                });
            };

            const areAllWeeksCollapsed = useMemo(() => {
                if (weeklyGroups.length === 0) return true;
                return weeklyGroups.every(wg => (collapsedWeeks[wg.weekKey] !== undefined ? collapsedWeeks[wg.weekKey] : isWeekCollapsedDefault(wg)));
            }, [weeklyGroups, collapsedWeeks, isViewingCurrentMonth]);

            const toggleAllWeeks = () => {
                const targetCollapse = !areAllWeeksCollapsed;
                const newMap = {};
                weeklyGroups.forEach(wg => {
                    newMap[wg.weekKey] = targetCollapse;
                });
                setCollapsedWeeks(newMap);
                showToast(targetCollapse ? 'Všechny týdny sbaleny' : 'Všechny týdny rozbaleny');
            };

            const scrollToTodayInList = () => {
                if (!isViewingCurrentMonth) {
                    setCurrentDate(new Date());
                }
                const currentWg = weeklyGroups.find(wg => wg.isCurrentWeek);
                if (currentWg) {
                    setCollapsedWeeks(prev => ({
                        ...prev,
                        [currentWg.weekKey]: false
                    }));
                }
                // Pokud jsme v režimu Pouze směny a dnes není směna, přepneme na Všechny dny, aby uživatel dnešek viděl
                if (!settings.showOffDaysInList && !shifts[todayStr]) {
                    saveSettings({ ...settings, showOffDaysInList: true });
                }
                setTimeout(() => {
                    const todayEl = document.getElementById('shift-list-today-row') || (currentWg ? document.getElementById(`week-group-${currentWg.weekKey}`) : null);
                    if (todayEl) {
                        todayEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 120);
            };

            // Předvolby pro rychlé nastavení exportu
            const applyExportPreset = (preset) => {
                if (preset === 'all') {
                    setExportConfig({
                        includeHeader: true,
                        includeShiftList: true,
                        includeShiftTimes: true,
                        includeShiftHours: true,
                        includeShiftPay: true,
                        includeContractType: true,
                        includeWorkedHours: true,
                        includeGross: true,
                        includeBonuses: true,
                        includeDeductions: true,
                        includeUniform: true,
                        includeNetTotal: true
                    });
                    setExportFormat('text');
                } else if (preset === 'shiftsOnly') {
                    setExportConfig({
                        includeHeader: true,
                        includeShiftList: true,
                        includeShiftTimes: true,
                        includeShiftHours: true,
                        includeShiftPay: false,
                        includeContractType: false,
                        includeWorkedHours: true,
                        includeGross: false,
                        includeBonuses: false,
                        includeDeductions: false,
                        includeUniform: false,
                        includeNetTotal: false
                    });
                } else if (preset === 'financialOnly') {
                    setExportConfig({
                        includeHeader: true,
                        includeShiftList: false,
                        includeShiftTimes: false,
                        includeShiftHours: false,
                        includeShiftPay: false,
                        includeContractType: false,
                        includeWorkedHours: true,
                        includeGross: true,
                        includeBonuses: true,
                        includeDeductions: true,
                        includeUniform: true,
                        includeNetTotal: true
                    });
                }
            };

            // Generování exportovaného textu na základě uživatelských voleb
            const generatedExportText = useMemo(() => {
                const monthName = new Intl.DateTimeFormat('cs-CZ', { month: 'long', year: 'numeric' }).format(currentDate);

                if (exportFormat === 'csv') {
                    let csv = 'Datum;Den;Typ;Cas;Hodiny;Vydelek_Kc;Uvazek\n';
                    monthlyData.list.forEach(s => {
                        const d = new Date(s.date);
                        const dayName = new Intl.DateTimeFormat('cs-CZ', { weekday: 'short' }).format(d);
                        const dateStr = `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`;
                        const typeLabel = s.type === 'vacation' ? 'Dovolená' : s.type === 'sick' ? 'Nemoc' : 'Práce';
                        const uniformItem = (s.type === 'work' && monthlyData.isUniformActive) ? (s.netMinutes / 60) * monthlyData.activeUniformRate : 0;
                        const shiftGross = Math.round(s.gross + uniformItem);
                        csv += `${dateStr};${dayName};${typeLabel};${s.raw || ''};${(s.netMinutes / 60).toFixed(2)};${shiftGross};${s.contractType || 'HPP'}\n`;
                    });
                    return csv;
                }

                let lines = [];

                if (exportConfig.includeHeader) {
                    lines.push(`📊 WageTracker – Přehled za ${monthName}`);
                    if (profileName) lines.push(`👤 Uživatel: ${profileName}`);
                    lines.push('═'.repeat(38));
                }

                if (exportConfig.includeShiftList) {
                    if (exportConfig.includeHeader) lines.push('📅 ROZPIS JEDNOTLIVÝCH SMĚN:');
                    if (monthlyData.list.length === 0) {
                        lines.push('• Žádné zapsané směny v tomto měsíci');
                    } else {
                        monthlyData.list.forEach(s => {
                            const d = new Date(s.date);
                            const dayName = new Intl.DateTimeFormat('cs-CZ', { weekday: 'short' }).format(d);
                            const dateFormatted = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;

                            let details = [];
                            if (s.type === 'vacation') details.push('Dovolená');
                            else if (s.type === 'sick') details.push('Nemoc');
                            else if (exportConfig.includeShiftTimes && s.raw) details.push(s.raw);
                            else details.push('Směna');

                            if (exportConfig.includeShiftHours) details.push(formatHrs(s.netMinutes));

                            const uniformItem = (s.type === 'work' && monthlyData.isUniformActive) ? (s.netMinutes / 60) * monthlyData.activeUniformRate : 0;
                            const shiftGross = Math.round(s.gross + uniformItem);

                            if (exportConfig.includeShiftPay) details.push(`${shiftGross.toLocaleString('cs-CZ')} Kč`);
                            if (exportConfig.includeContractType && s.contractType) details.push(`[${s.contractType}]`);

                            lines.push(`• ${dayName} ${dateFormatted}: ${details.join(' – ')}`);
                        });
                    }
                    if (exportConfig.includeHeader && (exportConfig.includeWorkedHours || exportConfig.includeGross || exportConfig.includeNetTotal)) {
                        lines.push('═'.repeat(38));
                    }
                }

                if (exportConfig.includeWorkedHours) {
                    lines.push(`⏱ Celkem směn: ${monthlyData.list.length}`);
                    lines.push(`⏱ Celkem hodin: ${formatHrs(monthlyData.actualHrs * 60)} (práce: ${formatHrs(monthlyData.workedHrsOnly * 60)})`);
                }

                if (exportConfig.includeGross) {
                    lines.push(`💰 Hrubá mzda: ${Math.round(monthlyData.gross).toLocaleString('cs-CZ')} Kč`);
                }

                if (exportConfig.includeBonuses) {
                    const bonusItems = [];
                    if (monthlyData.bonuses.night > 0) bonusItems.push(`Noční: +${Math.round(monthlyData.bonuses.night).toLocaleString('cs-CZ')} Kč`);
                    if (monthlyData.bonuses.weekend > 0) bonusItems.push(`Víkend: +${Math.round(monthlyData.bonuses.weekend).toLocaleString('cs-CZ')} Kč`);
                    if (monthlyData.bonuses.holiday > 0) bonusItems.push(`Svátek: +${Math.round(monthlyData.bonuses.holiday).toLocaleString('cs-CZ')} Kč`);
                    if (bonusItems.length > 0) {
                        lines.push(`🌟 Příplatky: ${bonusItems.join(', ')}`);
                    }
                }

                if (exportConfig.includeDeductions) {
                    const totalDeductions = Math.round(monthlyData.soc + monthlyData.zdra + Math.max(0, monthlyData.rawTax - monthlyData.appliedDiscount));
                    lines.push(`🛡 Odvody celkem: -${totalDeductions.toLocaleString('cs-CZ')} Kč`);
                    if (exportFormat !== 'compact') {
                        lines.push(`   (SZ: -${Math.round(monthlyData.soc).toLocaleString('cs-CZ')} Kč, ZP: -${Math.round(monthlyData.zdra).toLocaleString('cs-CZ')} Kč, Daň: -${Math.round(Math.max(0, monthlyData.rawTax - monthlyData.appliedDiscount)).toLocaleString('cs-CZ')} Kč)`);
                    }
                }

                if (exportConfig.includeUniform && monthlyData.isUniformActive && monthlyData.uniformPay > 0) {
                    lines.push(`👕 Osvobozeno (uniforma): +${Math.round(monthlyData.uniformPay).toLocaleString('cs-CZ')} Kč`);
                }

                if (exportConfig.includeNetTotal) {
                    if (exportConfig.includeHeader) lines.push('═'.repeat(38));
                    if (exportFormat !== 'compact') lines.push(`💵 Čistá mzda: ${Math.round(monthlyData.netWageOnly).toLocaleString('cs-CZ')} Kč`);
                    lines.push(`💳 CELKEM K VÝPLATĚ: ${Math.round(monthlyData.net).toLocaleString('cs-CZ')} Kč`);
                }

                return lines.join('\n');
            }, [currentDate, monthlyData, profileName, exportConfig, exportFormat]);

            const handleCopyExportText = () => {
                navigator.clipboard.writeText(generatedExportText).then(() => {
                    showToast('Přehled zkopírován do schránky! 📋');
                }).catch(() => {
                    showToast('Nepodařilo se zkopírovat.');
                });
            };

            const handleShareExportText = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: `WageTracker přehled za ${new Intl.DateTimeFormat('cs-CZ', { month: 'long', year: 'numeric' }).format(currentDate)}`,
                            text: generatedExportText
                        });
                        showToast('Sdíleno ✓');
                    } catch (e) {
                        // User cancelled
                    }
                } else {
                    handleCopyExportText();
                }
            };

            const handleDownloadExportFile = () => {
                const isCsv = exportFormat === 'csv';
                const filename = `WageTracker-${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}.${isCsv ? 'csv' : 'txt'}`;
                const blob = new Blob([generatedExportText], { type: isCsv ? 'text/csv;charset=utf-8;' : 'text/plain;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`Soubor ${filename} stažen 💾`);
            };

            const openEditor = (dateStr) => {
                const s = shifts[dateStr]; 
                setEditingDate(dateStr);
                setEditorHadShift(Boolean(s));
                setPendingEditorNav(null);

                let type = 'work';
                let brk = '';
                let hrs = '8';
                let rate = settings.defaultRate;
                let contract = settings.defaultContract;
                let sh = '', sm = '', eh = '', em = '';

                if (s) { 
                    type = s.type || 'work';
                    brk = s.breakMinutes !== undefined ? s.breakMinutes.toString() : '';
                    hrs = s.type !== 'work' ? (s.netMinutes/60).toString() : '8';
                    rate = s.rate;
                    contract = s.contractType || settings.defaultContract;

                    if (s.type === 'work' && s.raw) {
                        const parts = s.raw.replace(/\s/g, '').split('-');
                        if (parts.length === 2) {
                            const p1 = parts[0].split(':'); sh = p1[0] ? p1[0].padStart(2, '0') : ''; sm = p1[1] ? p1[1].padStart(2, '0') : '';
                            const p2 = parts[1].split(':'); eh = p2[0] ? p2[0].padStart(2, '0') : ''; em = p2[1] ? p2[1].padStart(2, '0') : '';
                        }
                    }
                }

                setEditorType(type);
                setBreakValue(brk);
                setHoursValue(hrs);
                setRateValue(rate);
                setShiftContract(contract);
                setStartHour(sh);
                setStartMin(sm);
                setEndHour(eh);
                setEndMin(em);

                setInitialEditorValues({
                    type,
                    startHour: sh,
                    startMin: sm,
                    endHour: eh,
                    endMin: em,
                    breakValue: brk,
                    hoursValue: hrs,
                    rateValue: String(rate),
                    shiftContract: contract
                });
            };

            const isEditorDirty = useMemo(() => {
                if (!editingDate || !initialEditorValues) return false;
                if (editorType !== initialEditorValues.type) return true;
                if (editorType === 'work') {
                    if (startHour !== initialEditorValues.startHour) return true;
                    if (startMin !== initialEditorValues.startMin) return true;
                    if (endHour !== initialEditorValues.endHour) return true;
                    if (endMin !== initialEditorValues.endMin) return true;
                    if (breakValue !== initialEditorValues.breakValue) return true;
                } else {
                    if (hoursValue !== initialEditorValues.hoursValue) return true;
                }
                if (String(rateValue) !== String(initialEditorValues.rateValue)) return true;
                if (shiftContract !== initialEditorValues.shiftContract) return true;
                return false;
            }, [editingDate, initialEditorValues, editorType, startHour, startMin, endHour, endMin, breakValue, hoursValue, rateValue, shiftContract]);

            const navigateEditorDayDirect = (dayDelta) => {
                if (!editingDate) return;
                const d = new Date(editingDate + 'T00:00:00');
                d.setDate(d.getDate() + dayDelta);
                const nextDateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                if (d.getFullYear() !== year || d.getMonth() !== month) {
                    setCurrentDate(new Date(d.getFullYear(), d.getMonth(), 1));
                }
                openEditor(nextDateStr);
            };

            const requestCloseEditor = () => {
                if (isEditorDirty) {
                    setPendingEditorNav('close');
                } else {
                    setEditingDate(null);
                    setPendingEditorNav(null);
                }
            };

            const requestNavigateEditorDay = (dayDelta) => {
                if (isEditorDirty) {
                    setPendingEditorNav({ type: 'day', delta: dayDelta });
                } else {
                    navigateEditorDayDirect(dayDelta);
                }
            };

            const handleConfirmDiscard = () => {
                if (pendingEditorNav === 'close') {
                    setEditingDate(null);
                    setPendingEditorNav(null);
                } else if (pendingEditorNav && pendingEditorNav.type === 'day') {
                    const delta = pendingEditorNav.delta;
                    setPendingEditorNav(null);
                    navigateEditorDayDirect(delta);
                }
            };

            const handleConfirmSaveAndProceed = async () => {
                const nav = pendingEditorNav;
                setPendingEditorNav(null);
                if (nav === 'close') {
                    await handleSaveShift(false);
                } else if (nav && nav.type === 'day') {
                    if (nav.delta === 1) {
                        await handleSaveShift(true);
                    } else {
                        await handleSaveShift(false);
                        navigateEditorDayDirect(nav.delta);
                    }
                }
            };

            const applyPreset = (preset) => {
                setStartHour(preset.sh);
                setStartMin(preset.sm);
                setEndHour(preset.eh);
                setEndMin(preset.em);
                setBreakValue(preset.brk);
                showToast(`Nastavena ${preset.label} směna`);
            };

            const goToPreviousMonth = () => {
                setSwipeDirection('right');
                setCurrentDate(new Date(year, month - 1, 1));
            };

            const goToNextMonth = () => {
                setSwipeDirection('left');
                setCurrentDate(new Date(year, month + 1, 1));
            };

            const handleTouchStart = (e) => { 
                touchStartX.current = e.targetTouches[0].clientX; 
                touchStartY.current = e.targetTouches[0].clientY; 
                touchEndX.current = e.targetTouches[0].clientX; 
                touchEndY.current = e.targetTouches[0].clientY; 
                swipeDistance.current = 0;
            };

            const handleTouchMove = (e) => { 
                touchEndX.current = e.targetTouches[0].clientX; 
                touchEndY.current = e.targetTouches[0].clientY; 
                const diffX = touchStartX.current - touchEndX.current;
                const diffY = touchStartY.current - touchEndY.current;
                swipeDistance.current = Math.hypot(diffX, diffY);
            };

            const handleTouchEnd = () => {
                const diffX = touchStartX.current - touchEndX.current; 
                const diffY = touchStartY.current - touchEndY.current;
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 45) {
                    if (diffX > 0) {
                        goToNextMonth();
                    } else {
                        goToPreviousMonth();
                    }
                }
                touchStartX.current = 0; 
                touchEndX.current = 0; 
                touchStartY.current = 0; 
                touchEndY.current = 0;
            };
            
            const displayStart = startHour + startMin;
            let formattedStart = displayStart;
            if (displayStart.length >= 3) {
                formattedStart = displayStart.slice(0, 2) + ':' + displayStart.slice(2);
            }
            
            const displayEnd = endHour + endMin;
            let formattedEnd = displayEnd;
            if (displayEnd.length >= 3) {
                formattedEnd = displayEnd.slice(0, 2) + ':' + displayEnd.slice(2);
            }

            if (isInitializing) return (
                <div className="min-h-screen flex flex-col items-center justify-center dark:bg-slate-950 transition-colors duration-500">
                    <div className="w-16 h-16 bg-blue-50 dark:bg-slate-900 rounded-3xl flex items-center justify-center mb-4 shadow-sm">
                        <i className="fa-solid fa-wallet text-2xl text-blue-600 animate-pulse"></i>
                    </div>
                    <h2 className="text-xl font-black text-slate-800 dark:text-white italic tracking-tight">WageTracker</h2>
                    <p className="text-xs text-slate-400 font-semibold mt-1">Načítám tvá data...</p>
                </div>
            );

            if (!activePin || globalError) return <AuthScreen onLoginSuccess={handleLoginSuccess} globalError={globalError} />;

            return (
                <div className="max-w-md mx-auto min-h-screen p-4 pb-36">
                    <Toast message={toastMessage} />

                    {/* --- App Header --- */}
                    <header className="flex justify-between items-center mb-4 pt-1 px-1">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-2xl text-white shadow-md shadow-blue-500/20 w-11 h-11 flex items-center justify-center">
                                <i className="fa-solid fa-wallet text-lg"></i>
                            </div>
                            <div>
                                <h1 className="text-lg font-black italic tracking-tight text-slate-900 dark:text-white leading-tight">WageTracker</h1>
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                                    {profileName ? `Ahoj, ${profileName.split(' ')[0]}` : 'Moje výplata'}
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => setActiveTab('settings')} 
                                className={`w-10 h-10 rounded-2xl flex items-center justify-center border transition-all active:scale-90 ${activeTab === 'settings' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/25' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200/80 dark:border-slate-800/80 shadow-sm'}`}
                                title="Nastavení"
                            >
                                <i className="fa-solid fa-gear text-sm"></i>
                            </button>
                        </div>
                    </header>

                    {/* --- PERSISTENT MONTH PICKER (Doesn't flash on tab switch) --- */}
                    {['calendar', 'list', 'payslip', 'stats'].includes(activeTab) && (
                        <div 
                            onTouchStart={handleTouchStart}
                            onTouchMove={handleTouchMove}
                            onTouchEnd={handleTouchEnd}
                            className="mb-3.5"
                        >
                            <MonthPickerBar 
                                currentDate={currentDate}
                                year={year}
                                month={month}
                                isViewingCurrentMonth={isViewingCurrentMonth}
                                setCurrentDate={setCurrentDate}
                                onPrevMonth={goToPreviousMonth}
                                onNextMonth={goToNextMonth}
                            />
                        </div>
                    )}

                    {/* --- CALENDAR TAB --- */}
                    {activeTab === 'calendar' && (
                        <div 
                            key={`calendar-${year}-${month}`}
                            className={`space-y-3.5 ${swipeDirection === 'left' ? 'animate-month-slide-left' : swipeDirection === 'right' ? 'animate-month-slide-right' : 'animate-fade-in'}`}
                        >
                            {/* Quick Monthly Summary Strip */}
                            <div className="grid grid-cols-3 gap-2 bg-gradient-to-r from-slate-900 to-slate-800 dark:from-slate-900 dark:to-slate-950 text-white p-3.5 rounded-2xl shadow-sm border border-slate-800">
                                <div className="flex flex-col items-center justify-center text-center">
                                    <span className="text-[9px] font-bold uppercase tracking-wider text-slate-400">Směny</span>
                                    <span className="text-base font-black text-white mt-0.5 leading-none">{monthlyData.list.length}</span>
                                    {isViewingCurrentMonth && (
                                        <span className="text-[9px] text-slate-400 font-semibold mt-1 leading-tight">
                                            k dnešku: <strong className="text-slate-200">{toDateData.countToday}</strong>
                                        </span>
                                    )}
                                </div>
                                <div className="flex flex-col items-center justify-center text-center border-x border-slate-700/60">
                                    <span className="text-[9px] font-bold uppercase tracking-wider text-slate-400">Odpracováno</span>
                                    <span className="text-base font-black text-blue-400 mt-0.5 leading-none">{formatHrs(monthlyData.workedHrsOnly * 60)}</span>
                                    {isViewingCurrentMonth && (
                                        <span className="text-[9px] text-slate-400 font-semibold mt-1 leading-tight">
                                            k dnešku: <strong className="text-blue-300">{formatHrs(toDateData.workedHrsToday * 60)}</strong>
                                        </span>
                                    )}
                                </div>
                                <div className="flex flex-col items-center justify-center text-center">
                                    <span className="text-[9px] font-bold uppercase tracking-wider text-slate-400">K výplatě</span>
                                    <span className="text-base font-black text-emerald-400 mt-0.5 leading-none">
                                        {Math.round(monthlyData.net).toLocaleString('cs-CZ')} Kč
                                    </span>
                                    {isViewingCurrentMonth && (
                                        <span className="text-[9px] text-slate-400 font-semibold mt-1 leading-tight">
                                            k dnešku: <strong className="text-emerald-300">{Math.round(toDateData.netToday).toLocaleString('cs-CZ')} Kč</strong>
                                        </span>
                                    )}
                                </div>
                            </div>
                            
                            {/* Calendar Grid */}
                            <div 
                                onTouchStart={handleTouchStart} 
                                onTouchMove={handleTouchMove} 
                                onTouchEnd={handleTouchEnd} 
                                className="bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-200/80 dark:border-slate-800/80 overflow-hidden shadow-sm touch-pan-y select-none"
                            >
                                <div className="grid grid-cols-7 bg-slate-50/80 dark:bg-slate-900/80 border-b border-slate-200/80 dark:border-slate-800/80">
                                    {['Po','Út','St','Čt','Pá','So','Ne'].map((d, idx) => (
                                        <div key={d} className={`py-2 text-center text-[10px] font-extrabold uppercase tracking-wider ${idx >= 5 ? 'text-amber-500/90 dark:text-amber-400/90' : 'text-slate-400 dark:text-slate-500'}`}>
                                            {d}
                                        </div>
                                    ))}
                                </div>

                                                                type="button"
                                                                onClick={() => setExportConfig(c => ({ ...c, includeUniform: !c.includeUniform }))}
                                                                className={`w-10 h-6 rounded-full relative transition-colors ${exportConfig.includeUniform ? 'bg-blue-600' : 'bg-slate-300 dark:bg-slate-700'}`}
                                                            >
                                                                <div className={`w-5 h-5 bg-white rounded-full absolute top-0.5 transition-transform shadow-xs ${exportConfig.includeUniform ? 'translate-x-4.5' : 'translate-x-0.5'}`}></div>
                                                            </button>
                                                        </div>
                                                    )}
                                                    <div className="flex items-center justify-between p-3">
                                                        <span className="text-xs font-bold text-slate-700 dark:text-slate-200">Čistá mzda / Celkem k výplatě</span>
                                                        <button 
                                                            type="button"
                                                            onClick={() => setExportConfig(c => ({ ...c, includeNetTotal: !c.includeNetTotal }))}
                                                            className={`w-10 h-6 rounded-full relative transition-colors ${exportConfig.includeNetTotal ? 'bg-blue-600' : 'bg-slate-300 dark:bg-slate-700'}`}
                                                        >
                                                            <div className={`w-5 h-5 bg-white rounded-full absolute top-0.5 transition-transform shadow-xs ${exportConfig.includeNetTotal ? 'translate-x-4.5' : 'translate-x-0.5'}`}></div>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* 4. Živý náhled generované zprávy */}
                                    <div>
                                        <div className="flex justify-between items-center mb-1.5 px-0.5">
                                            <label className="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Živý náhled zprávy</label>
                                            <span className="text-[10px] text-slate-400 font-mono">
                                                {generatedExportText.split('\n').length} řádků
                                            </span>
                                        </div>
                                        <pre className="max-h-36 overflow-y-auto bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 text-[11px] font-mono text-slate-800 dark:text-slate-200 whitespace-pre-wrap select-all leading-relaxed shadow-inner">
                                            {generatedExportText}
                                        </pre>
                                    </div>
                                </div>

                                {/* Modal Bottom Actions */}
                                <div className="flex gap-2 mt-4 pt-3 border-t border-slate-100 dark:border-slate-800/60">
                                    <button 
                                        type="button" 
                                        onClick={handleDownloadExportFile} 
                                        className="py-3 px-3.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold rounded-2xl active:scale-95 transition-transform text-xs flex items-center justify-center gap-1.5 border border-slate-200/80 dark:border-slate-700"
                                        title="Stáhnout jako soubor"
                                    >
                                        <i className="fa-solid fa-download"></i>
                                        <span className="hidden sm:inline">Stáhnout</span>
                                    </button>

                                    {navigator.share && (
                                        <button 
                                            type="button" 
                                            onClick={handleShareExportText} 
                                            className="py-3 px-3.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold rounded-2xl active:scale-95 transition-transform text-xs flex items-center justify-center gap-1.5 border border-slate-200/80 dark:border-slate-700"
                                            title="Sdílet v systému"
                                        >
                                            <i className="fa-solid fa-arrow-up-from-bracket"></i>
                                            <span className="hidden sm:inline">Sdílet</span>
                                        </button>
                                    )}

                                    <button 
                                        type="button" 
                                        onClick={() => {
                                            handleCopyExportText();
                                            setShowExportModal(false);
                                        }} 
                                        className="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-500/25 active:scale-95 transition-transform flex items-center justify-center gap-2 text-xs uppercase tracking-wider"
                                    >
                                        <i className="fa-regular fa-copy"></i> Zkopírovat do schránky
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
