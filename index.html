<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        // --- STREAMING_CHUNK: Initializing Firebase configuration and Czech Holiday Helper ---
        const firebaseConfig = {
          apiKey: "AIzaSyDI-epsVMbb2zD-akr72t5SLDoI6M7ieqY",
          authDomain: "wagetracker-cd4c4.firebaseapp.com",
          projectId: "wagetracker-cd4c4",
          storageBucket: "wagetracker-cd4c4.firebasestorage.app",
          messagingSenderId: "899828327925",
          appId: "1:899828327925:web:26d04d30af91b41d09acbc",
          measurementId: "G-1QB8KXD9YW"
        };
        
        let db, auth;
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (e) { console.error("Firebase init failed", e); }

        const { useState, useEffect, useMemo, useRef } = React;

        const getCzechHolidays = (year) => {
            const holidays = {
                '01-01': 'Nový rok', '05-01': 'Svátek práce', '05-08': 'Den vítězství',
                '07-05': 'Cyril a Metoděj', '07-06': 'Jan Hus', '09-28': 'Státnost',
                '10-28': 'Vznik ČSR', '11-17': 'Svoboda a demokracie', '12-24': 'Štědrý den',
                '12-25': '1. svátek vánoční', '12-26': '2. svátek vánoční',
            };
            const easter = { 2024: ['03-29', '04-01'], 2025: ['04-18', '04-21'], 2026: ['04-03', '04-06'] };
            const res = { ...holidays };
            if (easter[year]) { res[easter[year][0]] = 'Velký pátek'; res[easter[year][1]] = 'Velikonoční pondělí'; }
            return res;
        };

        // --- STREAMING_CHUNK: Animated Number Ticker Component ---
        const AnimatedNumber = ({ value }) => {
            const [displayValue, setDisplayValue] = useState(0);

            useEffect(() => {
                let startTimestamp = null;
                const duration = 600; 
                const startValue = displayValue;
                const endValue = value;

                if (startValue === endValue) return;

                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const easeProgress = 1 - Math.pow(1 - progress, 4); 
                    setDisplayValue(Math.floor(startValue + (endValue - startValue) * easeProgress));
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        setDisplayValue(endValue);
                    }
                };
                window.requestAnimationFrame(step);
            }, [value]);

            return <span>{displayValue.toLocaleString('cs-CZ')}</span>;
        };

        // --- STREAMING_CHUNK: Rendering Authentication and Login Screens ---
        const AuthScreen = ({ onLoginSuccess, globalError }) => {
            const [view, setView] = useState('login'); 
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(globalError || '');
            const [loginId, setLoginId] = useState('');
            const [firstName, setFirstName] = useState('');
            const [lastName, setLastName] = useState('');
            const [generatedId, setGeneratedId] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                if (loginId.length !== 8) return setError('ID musí mít 8 číslic.');
                setLoading(true); setError('');
                try {
                    const snap = await db.collection('profiles').doc(loginId).get();
                    if (snap.exists) onLoginSuccess(loginId, snap.data());
                    else setError('Účet neexistuje. Zkus se zaregistrovat.');
                } catch (err) { setError('Chyba spojení.'); }
                setLoading(false);
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!firstName.trim() || !lastName.trim()) return setError('Vyplň jméno a příjmení.');
                setLoading(true); setError('');
                try {
                    const newPin = Math.floor(10000000 + Math.random() * 90000000).toString();
                    const profile = { firstName: firstName.trim(), lastName: lastName.trim(), pin: newPin, createdAt: new Date().toISOString() };
                    await db.collection('profiles').doc(newPin).set(profile);
                    setGeneratedId(newPin); setView('success');
                } catch (err) { setError('Chyba zápisu.'); }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none p-8 border border-slate-100 dark:border-slate-800/60">
                        <div className="flex flex-col items-center mb-8">
                            <div className="bg-blue-600 p-4 rounded-3xl text-white shadow-xl mb-4 shadow-blue-200 dark:shadow-none flex items-center justify-center w-16 h-16">
                                <i className="fa-solid fa-wallet text-[32px]"></i>
                            </div>
                            <h1 className="text-2xl font-black text-slate-800 dark:text-white tracking-tight italic">WageTracker</h1>
                        </div>
                        
                        {error && (
                            <div className="mb-6 p-4 bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 text-xs font-bold rounded-2xl flex gap-2 items-center">
                                <i className="fa-solid fa-circle-exclamation"></i> <span>{error}</span>
                            </div>
                        )}
                        
                        {view === 'login' && (
                            <form onSubmit={handleLogin} className="space-y-6">
                                <input type="text" name="username" autoComplete="username" value="WageTracker Uživatel" className="hidden" readOnly />
                                <div>
                                    <label className="text-[10px] font-bold uppercase text-slate-400 mb-3 block text-center tracking-widest px-1">Tvé 8-místné ID</label>
                                    
                                    <div className="relative flex justify-between gap-1 w-full mt-2 group">
                                        {[0,1,2,3,4,5,6,7].map(i => (
                                            <div key={i} className={`w-9 h-14 flex items-center justify-center rounded-xl text-2xl font-black transition-all duration-200 ${
                                                loginId.length === i 
                                                ? 'ring-2 ring-blue-500 bg-white dark:bg-slate-800 scale-110 z-10 shadow-lg' 
                                                : loginId.length > i 
                                                    ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 border border-blue-100 dark:border-blue-800/50' 
                                                    : 'bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-transparent'
                                            }`}>
                                                {loginId[i] ? loginId[i] : ''}
                                            </div>
                                        ))}
                                        <input 
                                            type="password" 
                                            name="password" 
                                            autoComplete="current-password" 
                                            inputMode="numeric" 
                                            pattern="[0-9]*" 
                                            maxLength={8} 
                                            required
                                            value={loginId} 
                                            onChange={e => setLoginId(e.target.value.replace(/\D/g, '').slice(0, 8))} 
                                            className="absolute inset-0 w-full h-full opacity-0 text-transparent bg-transparent caret-transparent outline-none cursor-text z-20"
                                            style={{ WebkitUserSelect: 'text' }}
                                        />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-bold py-5 rounded-3xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all mt-4">
                                    {loading ? <i className="fa-solid fa-spinner fa-spin text-xl"></i> : <i className="fa-solid fa-shield-halved text-xl"></i>} PŘIHLÁSIT SE
                                </button>
                                <p className="text-center text-xs text-slate-500 mt-4">Nemáš ID? <button type="button" onClick={() => {setView('register'); setError('')}} className="text-blue-600 font-bold underline">Zaregistruj se</button></p>
                            </form>
                        )}
                        
                        {view === 'register' && (
                            <form onSubmit={handleRegister} className="space-y-4">
                                <input type="text" value={firstName} onChange={e => setFirstName(e.target.value)} placeholder="Jméno" className="w-full font-bold p-4 bg-slate-50 dark:bg-slate-950 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 text-slate-800 dark:text-slate-100 shadow-sm" required />
                                <input type="text" value={lastName} onChange={e => setLastName(e.target.value)} placeholder="Příjmení" className="w-full font-bold p-4 bg-slate-50 dark:bg-slate-950 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500 text-slate-800 dark:text-slate-100 shadow-sm" required />
                                <button type="submit" className="w-full bg-slate-800 dark:bg-white text-white dark:text-slate-900 font-bold py-5 rounded-3xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all mt-4">
                                    {loading ? <i className="fa-solid fa-spinner fa-spin text-xl"></i> : 'VYTVOŘIT ÚČET'}
                                </button>
                                <p className="text-center text-xs text-slate-500 mt-4">Máš ID? <button type="button" onClick={() => {setView('login'); setError('')}} className="text-blue-600 font-bold underline">Přihlas se</button></p>
                            </form>
                        )}
                        
                        {view === 'success' && (
                            <div className="animate-in zoom-in duration-500 flex flex-col items-center text-center w-full">
                                <i className="fa-solid fa-circle-check text-5xl text-emerald-500 mb-4"></i>
                                <h2 className="text-xl font-black text-slate-800 dark:text-white mb-2">Úspěch!</h2>
                                <p className="text-[10px] font-bold uppercase text-slate-400 mb-3 mt-4 tracking-widest">Tvé unikátní ID</p>
                                <div className="flex gap-1 justify-center mb-8 w-full">
                                    {generatedId.split('').map((char, i) => (
                                        <div key={i} className="w-9 h-14 flex items-center justify-center rounded-xl text-2xl font-black bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 border border-blue-100 dark:border-blue-800/50 shadow-sm">
                                            {char}
                                        </div>
                                    ))}
                                </div>
                                <p className="text-[10px] text-slate-400 mb-6 italic px-2 leading-relaxed">Po kliknutí ti telefon nabídne uložení ID do hesel. Potvrď to, ať se příště přihlásíš přes FaceID.</p>
                                <form onSubmit={(e) => { e.preventDefault(); onLoginSuccess(generatedId, { firstName, lastName }); }} className="w-full">
                                    <input type="text" name="username" autoComplete="username" value={`${firstName} ${lastName}`} className="hidden" readOnly />
                                    <input type="password" name="password" autoComplete="new-password" value={generatedId} className="hidden" readOnly />
                                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-5 rounded-3xl shadow-xl active:scale-95 tracking-widest uppercase transition-all">POKRAČOVAT</button>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- STREAMING_CHUNK: Base React Application Setup and Core State Management ---
        const App = () => {
            const [isInitializing, setIsInitializing] = useState(true);
            const [globalError, setGlobalError] = useState('');
            const [activePin, setActivePin] = useState(() => localStorage.getItem('wage-tracker-pin'));
            const [profileName, setProfileName] = useState('');
            const [activeTab, setActiveTab] = useState('calendar'); 
            const [currentDate, setCurrentDate] = useState(new Date());
            const [shifts, setShifts] = useState({});
            const [editingDate, setEditingDate] = useState(null);
            const [editorType, setEditorType] = useState('work'); 
            
            const [startHour, setStartHour] = useState('');
            const [startMin, setStartMin] = useState('');
            const [endHour, setEndHour] = useState('');
            const [endMin, setEndMin] = useState('');
            
            const [breakValue, setBreakValue] = useState('');
            const [hoursValue, setHoursValue] = useState('8');
            const [rateValue, setRateValue] = useState('0');
            const [shiftContract, setShiftContract] = useState('HPP');

            const [showBulkModal, setShowBulkModal] = useState(false);
            const [bulkRate, setBulkRate] = useState('');
            const [bulkTypeFilter, setBulkTypeFilter] = useState('all');
            const [bulkContractFilter, setBulkContractFilter] = useState('all');
            const [bulkLoading, setBulkLoading] = useState(false);
            const [bulkStatus, setBulkStatus] = useState('');

            const touchStartX = useRef(0);
            const touchEndX = useRef(0);
            const touchStartY = useRef(0);
            const touchEndY = useRef(0);

            const [settings, setSettings] = useState({
                defaultRate: 180, 
                defaultContract: 'HPP', 
                isDark: localStorage.getItem('shift-theme') === 'dark',
                bonuses: { night: 20, weekend: 10, holiday: 100 },
                discounts: { taxpayer: 2570, kids: 0 },
                uniformEnabled: true,       
                uniformRate: 5,             
                disabledUniformMonths: {},  
                customUniformRates: {}, 
                quarterlyAverages: {        
                    '2024-Q1': 139.23, '2024-Q2': 139.23, '2024-Q3': 139.23, '2024-Q4': 139.23,
                    '2025-Q1': 145.00, '2025-Q2': 145.00, '2025-Q3': 145.00, '2025-Q4': 145.00,
                    '2026-Q1': 150.00, '2026-Q2': 150.00, '2026-Q3': 150.00, '2026-Q4': 150.00
                },
                useAverageForPremiums: true  
            });

            const contractLabels = { 'HPP': 'Pracovní poměr (HPP)', 'DPČ': 'Dohoda DPČ', 'DPP': 'Dohoda DPP' };

            useEffect(() => {
                if (!auth) return setGlobalError('Firebase selhal.');
                auth.signInAnonymously().then(() => {
                    if (activePin) {
                        db.collection('profiles').doc(activePin).get().then(s => { if (s.exists) setProfileName(`${s.data().firstName} ${s.data().lastName}`); });
                        db.collection('settings').doc(activePin).get().then(s => { if (s.exists) setSettings(prev => ({ ...prev, ...s.data() })); });
                        db.collection(`shifts_${activePin}`).onSnapshot(snap => {
                            const data = {}; snap.forEach(d => data[d.id] = d.data()); setShifts(data);
                        }, err => { setGlobalError('Chyba databáze.'); });
                    }
                    setIsInitializing(false);
                }).catch(e => { setGlobalError(e.message); setIsInitializing(false); });
            }, [activePin]);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', settings.isDark);
                localStorage.setItem('shift-theme', settings.isDark ? 'dark' : 'light');
            }, [settings.isDark]);

            const saveSettings = async (newSettings) => {
                setSettings(newSettings);
                if (activePin) await db.collection('settings').doc(activePin).set(newSettings);
            };

            const handleLoginSuccess = (pin, pData) => {
                localStorage.setItem('wage-tracker-pin', pin); setActivePin(pin);
                if (pData) setProfileName(`${pData.firstName} ${pData.lastName}`);
            };

            const handleLogout = () => { localStorage.removeItem('wage-tracker-pin'); setActivePin(null); };

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const holidays = useMemo(() => getCzechHolidays(year), [year]);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;

            // Formátování hodin striktně na 2 desetinná místa
            const formatHrs = (m) => `${(m/60).toLocaleString('cs-CZ', {minimumFractionDigits: 2, maximumFractionDigits: 2})}h`;

            // --- STREAMING_CHUNK: Dynamic Duration Calculation for Live Editor ---
            const liveDuration = useMemo(() => {
                if (editorType !== 'work') return null;
                if (startHour === '' || endHour === '') return null;
                
                const sh = parseInt(startHour, 10) || 0;
                const sm = startMin !== '' ? (parseInt(startMin, 10) || 0) : 0;
                const eh = parseInt(endHour, 10) || 0;
                const em = endMin !== '' ? (parseInt(endMin, 10) || 0) : 0;
                
                const startTotal = sh * 60 + sm;
                const endTotal = eh * 60 + em;
                let diff = endTotal - startTotal;
                if (diff < 0) diff += 1440; 

                let breakMins = breakValue !== '' ? parseInt(breakValue, 10) : (diff > 360 ? 30 : 0);
                if (isNaN(breakMins)) breakMins = 0;
                let net = Math.max(0, diff - breakMins);

                const hours = Math.floor(net / 60);
                const mins = net % 60;

                return { netHours: hours, netMins: mins, breakMins };
            }, [startHour, startMin, endHour, endMin, breakValue, editorType]);

            const getQuarterKeyForDateStr = (dateStr) => {
                const dObj = new Date(dateStr);
                const q = Math.floor(dObj.getMonth() / 3) + 1;
                return `${dObj.getFullYear()}-Q${q}`;
            };

            // --- STREAMING_CHUNK: Advanced Salary Calculations considering Uniform and Quarterly Average Rate ---
            const calculateShiftDetails = (startMin, endMin, customBreak, rate, dateStr, type, fixedHours) => {
                if (type !== 'work') {
                    return { 
                        type, netMinutes: fixedHours * 60, base: fixedHours * rate, 
                        gross: type === 'vacation' ? fixedHours * rate : fixedHours * rate * 0.6, 
                        breakMinutes: 0, raw: `${fixedHours}h`, nBonus: 0, wBonus: 0, hBonus: 0,
                        nightHrs: 0, weekendHrs: 0, holidayHrs: 0
                    };
                }

                let diff = endMin - startMin; if (diff < 0) diff += 1440;
                let breakMins = customBreak !== '' ? parseInt(customBreak, 10) : (diff > 360 ? 30 : 0);
                let net = Math.max(0, diff - breakMins);
                
                const dObj = new Date(dateStr); 
                const isWk = [0, 6].includes(dObj.getDay());
                const isHol = !!holidays[`${String(month+1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`];
                
                // Opravené strhávání pauzy
                let rawNightMins = 0; 
                let rawDayMins = 0;
                for (let i = 0; i < diff; i++) { 
                    const cur = (startMin + i) % 1440; 
                    if (cur >= 1320 || cur < 360) rawNightMins++; 
                    else rawDayMins++;
                }
                
                let remainingBreak = Math.max(0, breakMins - rawDayMins);
                const nightMinutes = Math.max(0, rawNightMins - remainingBreak);
                
                const weekendMinutes = isWk ? net : 0;
                const holidayMinutes = isHol ? net : 0;

                const qKey = getQuarterKeyForDateStr(dateStr);
                const qAverage = settings.quarterlyAverages?.[qKey];
                const premiumBaseRate = (settings.useAverageForPremiums && qAverage > 0) ? parseFloat(qAverage) : rate;

                const base = (net / 60) * rate;
                const nB = (nightMinutes / 60) * premiumBaseRate * (settings.bonuses.night / 100);
                const wB = isWk ? (net / 60) * premiumBaseRate * (settings.bonuses.weekend / 100) : 0;
                const hB = isHol ? (net / 60) * premiumBaseRate * (settings.bonuses.holiday / 100) : 0;

                return { 
                    type: 'work', netMinutes: net, base, nBonus: nB, wBonus: wB, hBonus: hB, 
                    gross: base + nB + wB + hB, breakMinutes: breakMins,
                    nightHrs: nightMinutes / 60, weekendHrs: weekendMinutes / 60, holidayHrs: holidayMinutes / 60 
                };
            };

            const handleSaveShift = async () => {
                const rate = parseFloat(rateValue) || settings.defaultRate;
                let start = 0, end = 0, fHours = 8;
                let rawStr = '';
                if (editorType === 'work') {
                    const sh = startHour === '' ? 8 : (parseInt(startHour, 10) || 0);
                    const sm = startMin === '' ? 0 : (parseInt(startMin, 10) || 0);
                    const eh = endHour === '' ? 16 : (parseInt(endHour, 10) || 0);
                    const em = endMin === '' ? 0 : (parseInt(endMin, 10) || 0);
                    start = sh * 60 + sm;
                    end = eh * 60 + em;
                    rawStr = `${String(sh).padStart(2, '0')}:${String(sm).padStart(2, '0')}-${String(eh).padStart(2, '0')}:${String(em).padStart(2, '0')}`;
                } else {
                    fHours = parseFloat(hoursValue);
                    rawStr = `${fHours}h`;
                }
                const details = calculateShiftDetails(start, end, breakValue, rate, editingDate, editorType, fHours);
                await db.collection(`shifts_${activePin}`).doc(editingDate).set({ ...details, raw: rawStr, rate, contractType: shiftContract });
                setEditingDate(null);
            };

            const handleBulkRateUpdate = async (e) => {
                e.preventDefault();
                const newRate = parseFloat(bulkRate);
                if (isNaN(newRate) || newRate <= 0) return setBulkStatus('Chyba: Zadej platnou číselnou sazbu.');
                setBulkLoading(true); setBulkStatus('Přepočítávám a ukládám...');

                try {
                    const monthPrefix = `${year}-${String(month+1).padStart(2, '0')}`;
                    const targetDates = Object.keys(shifts).filter(dateStr => {
                        if (!dateStr.startsWith(monthPrefix)) return false;
                        const s = shifts[dateStr];
                        if (bulkTypeFilter !== 'all' && s.type !== bulkTypeFilter) return false;
                        if (bulkContractFilter !== 'all' && (s.contractType || 'HPP') !== bulkContractFilter) return false;
                        return true;
                    });

                    if (targetDates.length === 0) { setBulkStatus('Nebyly nalezeny žádné odpovídající směny.'); setBulkLoading(false); return; }

                    const batch = db.batch();
                    targetDates.forEach(dateStr => {
                        const s = shifts[dateStr];
                        let start = 0, end = 0;
                        if (s.type === 'work' && s.raw) {
                            const parts = s.raw.replace(/\s/g, '').split('-');
                            if (parts.length === 2) {
                                const toMin = (t) => { let [h, m] = t.split(':').map(Number); return h * 60 + (isNaN(m) ? 0 : m); };
                                start = toMin(parts[0]); end = toMin(parts[1]);
                            }
                        }
                        const fHours = s.netMinutes / 60;
                        const details = calculateShiftDetails(start, end, s.breakMinutes !== undefined ? s.breakMinutes.toString() : '', newRate, dateStr, s.type, fHours);
                        batch.set(db.collection(`shifts_${activePin}`).doc(dateStr), { ...s, ...details, rate: newRate }, { merge: true });
                    });

                    await batch.commit();
                    setBulkStatus(`Úspěšně upraveno ${targetDates.length} směn.`);
                    setTimeout(() => { setShowBulkModal(false); setBulkStatus(''); setBulkRate(''); }, 1500);
                } catch (err) { setBulkStatus('Chyba databáze.'); }
                setBulkLoading(false);
            };

            const monthlyData = useMemo(() => {
                const list = Object.keys(shifts).filter(k => k.startsWith(`${year}-${String(month+1).padStart(2, '0')}`)).sort().map(k => ({ date: k, ...shifts[k] }));
                const groups = { HPP: { gross: 0, hrs: 0, workHrs: 0, base: 0 }, DPČ: { gross: 0, hrs: 0, workHrs: 0, base: 0 }, DPP: { gross: 0, hrs: 0, workHrs: 0, base: 0 } };
                let nB = 0, wB = 0, hB = 0, baseW = 0, sickW = 0, vacW = 0, workHrs = 0;
                let nHrs = 0, wHrs = 0, hHrs = 0;

                let yearlyDPPHrs = 0;
                Object.keys(shifts).forEach(k => {
                    if (k.startsWith(`${year}-`)) {
                        const s = shifts[k];
                        if (s.contractType === 'DPP' && s.type === 'work') yearlyDPPHrs += s.netMinutes / 60;
                    }
                });
                
                list.forEach(s => {
                    const t = s.contractType || 'HPP'; if (!groups[t]) return;
                    groups[t].gross += s.gross; groups[t].hrs += s.netMinutes/60;
                    if (s.type === 'sick') sickW += s.gross;
                    else if (s.type === 'vacation') vacW += s.gross;
                    else { 
                        nB += (s.nBonus||0); wB += (s.wBonus||0); hB += (s.hBonus||0); 
                        nHrs += (s.nightHrs||0); wHrs += (s.weekendHrs||0); hHrs += (s.holidayHrs||0);
                        baseW += (s.base||0); workHrs += (s.netMinutes/60); 
                        groups[t].workHrs += (s.netMinutes/60); groups[t].base += (s.base||0);
                    }
                });

                const monthKey = `${year}-${String(month+1).padStart(2, '0')}`;
                const isUniformDisabledThisMonth = settings.disabledUniformMonths?.[monthKey] === true;
                const isUniformActive = settings.uniformEnabled && !isUniformDisabledThisMonth;
                const activeUniformRate = settings.customUniformRates?.[monthKey] !== undefined ? settings.customUniformRates[monthKey] : (parseFloat(settings.uniformRate) || 0);
                const uniformPay = isUniformActive ? (workHrs * activeUniformRate) : 0;

                let totalSoc = 0, totalZdra = 0, rawTax = 0, totalTaxableGross = 0;
                Object.keys(groups).forEach(t => {
                    const g = groups[t]; if (g.gross <= 0) return; 
                    totalTaxableGross += g.gross;
                    const roundedGrossForTax = Math.ceil(g.gross / 100) * 100;

                    if (t === 'HPP' || (t === 'DPP' && g.gross > 10500) || (t === 'DPČ' && g.gross >= 4000)) { 
                        totalSoc += g.gross * 0.071; totalZdra += g.gross * 0.045; rawTax += roundedGrossForTax * 0.15; 
                    } else rawTax += g.gross * 0.15; 
                });

                const sleva = Number(settings.discounts.taxpayer) + Number(settings.discounts.kids);
                const finalTax = Math.max(0, rawTax - sleva);
                const netWage = totalTaxableGross - totalSoc - totalZdra - finalTax;
                
                return { 
                    list, gross: totalTaxableGross, net: netWage + uniformPay, netWageOnly: netWage, uniformPay, activeUniformRate, isUniformActive,
                    soc: totalSoc, zdra: totalZdra, rawTax: rawTax, appliedDiscount: Math.min(rawTax, sleva), sleva, 
                    bonuses: { night: nB, weekend: wB, holiday: hB, base: baseW, sick: sickW, vacation: vacW, nightHrs: nHrs, weekendHrs: wHrs, holidayHrs: hHrs }, 
                    actualHrs: list.reduce((a,b)=>a+b.netMinutes,0)/60, workedHrsOnly: workHrs, contractGroups: groups, yearlyDPPHrs
                };
            }, [shifts, month, year, settings]);

            const openEditor = (dateStr) => {
                const s = shifts[dateStr]; setEditingDate(dateStr);
                if (s) { 
                    setEditorType(s.type || 'work'); setBreakValue(s.breakMinutes?.toString() || ''); 
                    setHoursValue(s.type !== 'work' ? (s.netMinutes/60).toString() : '8'); 
                    setRateValue(s.rate); setShiftContract(s.contractType || settings.defaultContract); 

                    let sh = '', sm = '', eh = '', em = '';
                    if (s.type === 'work' && s.raw) {
                        const parts = s.raw.replace(/\s/g, '').split('-');
                        if (parts.length === 2) {
                            const p1 = parts[0].split(':'); sh = p1[0] ? p1[0].padStart(2, '0') : ''; sm = p1[1] ? p1[1].padStart(2, '0') : '';
                            const p2 = parts[1].split(':'); eh = p2[0] ? p2[0].padStart(2, '0') : ''; em = p2[1] ? p2[1].padStart(2, '0') : '';
                        }
                    }
                    setStartHour(sh); setStartMin(sm); setEndHour(eh); setEndMin(em);
                }
                else { 
                    setEditorType('work'); setStartHour(''); setStartMin(''); setEndHour(''); setEndMin('');
                    setBreakValue(''); setRateValue(settings.defaultRate); setShiftContract(settings.defaultContract); 
                }
            };

            const handleTouchStart = (e) => { touchStartX.current = e.targetTouches[0].clientX; touchStartY.current = e.targetTouches[0].clientY; touchEndX.current = e.targetTouches[0].clientX; touchEndY.current = e.targetTouches[0].clientY; };
            const handleTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; touchEndY.current = e.targetTouches[0].clientY; };
            const handleTouchEnd = () => {
                const diffX = touchStartX.current - touchEndX.current; const diffY = touchStartY.current - touchEndY.current;
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {

                                        const ds = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                        
                                        const s = shifts[ds];

                                        return (
                                            <div key={ds} onClick={() => openEditor(ds)} className={`h-16 flex flex-col items-center justify-start py-1 border-b border-r border-slate-100 dark:border-slate-800/60 cursor-pointer active:scale-90 relative transition-all ${bg} ${isT ? 'ring-2 ring-inset ring-blue-500' : ''}`}>
                                                <span className={`text-[11px] font-bold ${txt}`}>{d}</span>
                                                <div className="flex justify-center gap-1 mt-1 h-1.5 w-full">
                                                    {s?.type==='work' && s.nBonus>0 && <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 shadow-sm"></span>}
                                                    {s?.type==='work' && s.wBonus>0 && <span className="w-1.5 h-1.5 rounded-full bg-amber-400 shadow-sm"></span>}
                                                    {s?.type==='work' && s.hBonus>0 && <span className="w-1.5 h-1.5 rounded-full bg-rose-400 shadow-sm"></span>}
                                                    {s?.type === 'vacation' && <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-sm"></span>}
                                                    {s?.type === 'sick' && <span className="w-1.5 h-1.5 rounded-full bg-orange-400 shadow-sm"></span>}
                                                </div>
                                                {s && <span className={`text-[9px] font-bold mt-auto leading-none pb-0.5 ${s.type === 'vacation' ? 'text-emerald-600' : s.type === 'sick' ? 'text-orange-600' : 'text-slate-500 dark:text-slate-400'}`}>{formatHrs(s.netMinutes)}</span>}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- STREAMING_CHUNK: Shifts List Tab --- */}
                    {activeTab === 'list' && (
                        <div className="space-y-3 animate-in fade-in slide-in-from-bottom-2 duration-300">
                            <div className="flex justify-between items-center mb-4 px-2">
                                <h2 className="font-bold text-xs uppercase text-slate-400 tracking-widest flex items-center gap-2">
                                    Moje směny <span className="bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded text-slate-500 text-[10px]">{monthlyData.list.length}</span>

                                {monthlyData.list.length > 0 && (
                                    <button onClick={() => setShowBulkModal(true)} className="text-[10px] font-bold uppercase text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20 px-3 py-1.5 rounded-xl hover:scale-95 transition-all flex items-center gap-1.5 border border-blue-100 dark:border-blue-800/40">
                                        <i className="fa-solid fa-pen-to-square"></i> Hromadná změna
                                    </button>
                                )}
                            </div>
                            
                            {monthlyData.list.length === 0 ? (
                                <div className="flex flex-col items-center justify-center py-16 px-6 text-center bg-white dark:bg-slate-900 rounded-[2.5rem] border border-slate-100 dark:border-slate-800/60 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none mt-2">
                                    <div className="w-20 h-20 bg-blue-50 dark:bg-slate-800 rounded-full flex items-center justify-center mb-6 shadow-inner">
                                        <i className="fa-regular fa-calendar-xmark text-3xl text-blue-300 dark:text-slate-500"></i>
                                    </div>
                                    <h3 className="font-black text-lg text-slate-800 dark:text-white mb-2">Žádné směny</h3>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed mb-8">V tomto měsíci nemáš zapsanou žádnou směnu. Kliknutím na tlačítko níže otevřeš kalendář a můžeš si je naplánovat.</p>
                                    <button onClick={() => setActiveTab('calendar')} className="bg-blue-600 text-white font-bold py-3.5 px-8 rounded-2xl shadow-lg shadow-blue-200 dark:shadow-none active:scale-95 transition-all flex items-center gap-2">
                                        <i className="fa-solid fa-plus"></i> Přidat první směnu
                                    </button>
                                </div>
                            ) : (
                                monthlyData.list.map(s => {
                                    const shiftUniformPay = (s.type === 'work' && monthlyData.isUniformActive) ? (s.netMinutes / 60) * monthlyData.activeUniformRate : 0;
                                    const displayTotal = s.gross + shiftUniformPay;

                                    return (
                                        <div key={s.date} onClick={() => { openEditor(s.date); }} className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800/60 flex flex-col gap-3 active:scale-95 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none transition-transform cursor-pointer">

                    {/* --- STREAMING_CHUNK: Advanced Payslip Tab (Fintech Design) --- */}

                                    <p className="text-[10px] font-bold uppercase text-slate-400 tracking-widest mb-1">Přihlášen jako</p>
                                    <p className="font-black text-lg">{profileName || 'Uživatel'}</p>
                                    <p className="text-[10px] font-bold text-slate-400 font-mono mt-1 px-3 py-1 bg-white dark:bg-slate-800 rounded-lg inline-block border border-slate-100 dark:border-slate-800/60 shadow-sm">ID: <span className="text-slate-600 dark:text-slate-300">{activePin}</span></p>
                                </div>
                                <button onClick={handleLogout} className="w-full py-4 rounded-2xl font-bold text-sm text-rose-500 bg-rose-50 dark:bg-rose-900/20 active:scale-95 transition-transform flex items-center justify-center gap-2">
                                    <i className="fa-solid fa-arrow-right-from-bracket"></i> ODHLÁSIT SE
                                </button>
                                <p className="text-[10px] text-slate-400 max-w-xs mx-auto leading-relaxed pb-4">
                                    Aplikace je uložena v tomto prohlížeči. Odhlášením vymažeš lokální data a budeš potřebovat své ID pro opětovné přihlášení.
                                </p>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-6 left-4 right-4 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-100 dark:border-slate-800/60 rounded-[2rem] py-2 px-4 flex justify-around items-center z-40 shadow-[0_8px_30px_rgb(0,0,0,0.06)] dark:shadow-none">
                        {[{ id: 'calendar', icon: 'fa-calendar-days', label: 'Měsíc' }, { id: 'list', icon: 'fa-list', label: 'Směny' }, { id: 'payslip', icon: 'fa-file-invoice-dollar', label: 'Výplatnice' }].map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`relative flex flex-col items-center justify-center w-16 h-14 rounded-2xl transition-all duration-300 ${activeTab === t.id ? 'text-blue-600 dark:text-blue-400 bg-blue-50/70 dark:bg-blue-900/30' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
                                <i className={`fa-solid ${t.icon} text-[20px] mb-1 transition-transform duration-300 ${activeTab === t.id ? 'scale-110 drop-shadow-sm' : ''}`}></i>
                                <span className={`text-[8px] uppercase tracking-widest ${activeTab === t.id ? 'font-black' : 'font-semibold'}`}>{t.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* --- STREAMING_CHUNK: Enhanced Modal Editor --- */}
                    {editingDate && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end justify-center sm:items-center sm:p-4 animate-in fade-in duration-200">
                            <div className="bg-white dark:bg-slate-950 w-full sm:max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 shadow-2xl flex flex-col max-h-[90vh] animate-in slide-in-from-bottom-full duration-300">
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <h3 className="font-black text-xl">{new Intl.DateTimeFormat('cs-CZ', {weekday:'long', day:'numeric', month:'long'}).format(new Date(editingDate))}</h3>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Upravit den</p>
                                    </div>
                                    <button onClick={() => setEditingDate(null)} className="w-10 h-10 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-500 active:scale-90 transition-transform"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>

                                <div className="relative flex bg-slate-100 dark:bg-slate-900 p-1.5 rounded-2xl mb-6 overflow-hidden">
                                    <div className={`absolute top-1.5 bottom-1.5 w-[calc(33.33%-4px)] bg-white dark:bg-slate-800 rounded-xl shadow-sm transition-all duration-300 ease-out ${editorType === 'work' ? 'left-1.5' : editorType === 'vacation' ? 'left-[calc(33.33%+2px)]' : 'left-[calc(66.66%+2px)]'}`}></div>
                                    <button onClick={() => { setEditorType('work'); }} className={`relative z-10 flex-1 py-2 rounded-xl text-xs font-bold transition-colors duration-300 ${editorType === 'work' ? 'text-blue-600 dark:text-blue-400' : 'text-slate-500 hover:text-slate-700'}`}>SMĚNA</button>
                                    <button onClick={() => { setEditorType('vacation'); setHoursValue('8'); }} className={`relative z-10 flex-1 py-2 rounded-xl text-xs font-bold transition-colors duration-300 ${editorType === 'vacation' ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500 hover:text-slate-700'}`}>DOVOLENÁ</button>
                                    <button onClick={() => { setEditorType('sick'); setHoursValue('8'); }} className={`relative z-10 flex-1 py-2 rounded-xl text-xs font-bold transition-colors duration-300 ${editorType === 'sick' ? 'text-orange-600 dark:text-orange-400' : 'text-slate-500 hover:text-slate-700'}`}>NEMOCENSKÁ</button>
                                </div>

                                <div className="space-y-5 overflow-y-auto pb-4 px-1" style={{ scrollbarWidth: 'none' }}>
                                    {editorType === 'work' ? (
                                        <>
                                            <div className="text-center">
                                                <label className="text-[10px] font-bold text-slate-400 block mb-3 uppercase tracking-widest text-center">Čas směny</label>
                                                <div className="flex items-center justify-between bg-slate-50 dark:bg-slate-900/50 p-2 rounded-3xl border border-slate-200 dark:border-slate-800 focus-within:ring-2 focus-within:ring-blue-500/50 transition-all max-w-[280px] mx-auto shadow-sm">
                                                    
                                                    <div className="flex items-center bg-white dark:bg-slate-900 px-3 py-2 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800/80">
                                                        <input 
                                                            type="text" 
                                                            inputMode="numeric" 
                                                            pattern="[0-9]*" 
                                                            maxLength={5} 
                                                            value={formattedStart} 
                                                            onFocus={e => e.target.select()}
                                                            onChange={e => {
                                                                const val = e.target.value.replace(/\D/g, '');
                                                                if (val.length === 0) { setStartHour(''); setStartMin(''); }
                                                                else if (val.length <= 2) {
                                                                    if (parseInt(val, 10) > 23) return;
                                                                    setStartHour(val); setStartMin('');
                                                                }
                                                                else if (val.length <= 4) {
                                                                    const h = val.slice(0, 2); const m = val.slice(2, 4);
                                                                    if (parseInt(m, 10) > 59) return;
                                                                    setStartHour(h); setStartMin(m);
                                                                }
                                                            }} 
                                                            className="w-24 text-center text-2xl font-black bg-transparent outline-none text-slate-800 dark:text-slate-100 tracking-widest" 
                                                            placeholder="00:00" 
                                                        />
                                                    </div>

                                                    <i className="fa-solid fa-arrow-right-long text-slate-300 dark:text-slate-600 text-sm"></i>

                                                    <div className="flex items-center bg-white dark:bg-slate-900 px-3 py-2 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800/80">
                                                        <input 
                                                            type="text" 
                                                            inputMode="numeric" 
                                                            pattern="[0-9]*" 
                                                            maxLength={5} 
                                                            value={formattedEnd} 
                                                            onFocus={e => e.target.select()}
                                                            onChange={e => {
                                                                const val = e.target.value.replace(/\D/g, '');
                                                                if (val.length === 0) { setEndHour(''); setEndMin(''); }
                                                                else if (val.length <= 2) {
                                                                    if (parseInt(val, 10) > 23) return;
                                                                    setEndHour(val); setEndMin('');
                                                                }
                                                                else if (val.length <= 4) {
                                                                    const h = val.slice(0, 2); const m = val.slice(2, 4);
                                                                    if (parseInt(m, 10) > 59) return;
                                                                    setEndHour(h); setEndMin(m);
                                                                }
                                                            }} 
                                                            className="w-24 text-center text-2xl font-black bg-transparent outline-none text-slate-800 dark:text-slate-100 tracking-widest" 
                                                            placeholder="00:00" 
                                                        />
                                                    </div>
                                                </div>

                                                {liveDuration ? (
                                                    <div className="mt-4 inline-flex items-center gap-2 bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 py-2.5 px-5 rounded-2xl font-bold text-xs transition-all animate-in animate-duration-150">
                                                        <i className="fa-regular fa-clock text-sm"></i>
                                                        <span>Celkem odpracováno: {liveDuration.netHours}h {String(liveDuration.netMins).padStart(2, '0')}m</span>
                                                        <span className="text-[10px] text-slate-400 dark:text-slate-500 font-bold uppercase tracking-widest pl-1.5 border-l border-slate-200 dark:border-slate-800">pauza {liveDuration.breakMins}m</span>
                                                    </div>
                                                ) : (
                                                    <div className="mt-4 text-[10px] text-slate-400 italic">Zadejte časy pro výpočet délky směny</div>
                                                )}
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-[10px] font-bold uppercase text-slate-400 mb-2 block tracking-widest">Pauza (min)</label>
                                                    <div className="relative">
                                                        <i className="fa-solid fa-mug-hot absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                                        <input type="number" value={breakValue} onChange={e => setBreakValue(e.target.value)} placeholder="Auto" className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 pl-12 font-bold outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white" />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold uppercase text-slate-400 mb-2 block tracking-widest">Sazba (Kč/h)</label>
                                                    <div className="relative">
                                                        <i className="fa-solid fa-coins absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                                        <input type="number" value={rateValue} onChange={e => setRateValue(e.target.value)} placeholder={settings.defaultRate} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 pl-12 font-bold outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white" />
                                                    </div>
                                                </div>
                                            </div>
                                        </>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-[10px] font-bold uppercase text-slate-400 mb-2 block tracking-widest">Hodin</label>
                                                <div className="relative">
                                                    <i className="fa-regular fa-clock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                                    <input type="number" step="0.5" value={hoursValue} onChange={e => setHoursValue(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 pl-12 font-bold outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold uppercase text-slate-400 mb-2 block tracking-widest">Sazba (Kč/h)</label>
                                                <div className="relative">
                                                    <i className="fa-solid fa-coins absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                                    <input type="number" value={rateValue} onChange={e => setRateValue(e.target.value)} placeholder={settings.defaultRate} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 pl-12 font-bold outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white" />
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 mb-2 block tracking-widest">Smlouva</label>
                                        <div className="relative bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
                                            <i className="fa-solid fa-file-signature absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 z-10 pointer-events-none"></i>
                                            <i className="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 z-10 pointer-events-none text-xs"></i>
                                            <select value={shiftContract} onChange={e => setShiftContract(e.target.value)} className="w-full bg-transparent p-4 pl-12 pr-10 font-bold outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white appearance-none cursor-pointer relative z-0">
                                                {Object.keys(contractLabels).map(k => <option key={k} value={k} className="bg-white dark:bg-slate-900">{contractLabels[k]}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-3 mt-4 pt-4 border-t border-slate-100 dark:border-slate-800/60">
                                    {shifts[editingDate] && (
                                        <button onClick={async () => { await db.collection(`shifts_${activePin}`).doc(editingDate).delete(); setEditingDate(null); }} className="p-4 bg-rose-50 dark:bg-rose-900/20 text-rose-500 rounded-2xl active:scale-95 transition-transform aspect-square flex items-center justify-center shadow-sm">
                                            <i className="fa-solid fa-trash"></i>
                                        </button>
                                    )}
                                    <button onClick={handleSaveShift} className="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-200 dark:shadow-none active:scale-95 transition-transform flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-check"></i> ULOŽIT
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- STREAMING_CHUNK: Modal for Bulk Rate Change --- */}
                    {showBulkModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end justify-center sm:items-center sm:p-4 animate-in fade-in duration-200">
                            <form onSubmit={handleBulkRateUpdate} className="bg-white dark:bg-slate-950 w-full sm:max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 shadow-2xl flex flex-col max-h-[90vh] animate-in slide-in-from-bottom-full duration-300">
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <h3 className="font-black text-xl">Hromadná změna sazeb</h3>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Uplatnit na aktuální měsíc</p>
                                    </div>
                                    <button type="button" onClick={() => { setShowBulkModal(false); setBulkStatus(''); }} className="w-10 h-10 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-500 active:scale-90 transition-transform"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 mb-2 block tracking-widest">Nová hodinová sazba</label>
                                        <div className="relative">
                                            <i className="fa-solid fa-coins absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                            <input type="number" required value={bulkRate} onChange={e => setBulkRate(e.target.value)} placeholder="Napiš novou sazbu (např. 140)" className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 pl-12 font-bold outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 mb-2 block tracking-widest">Filtrovat typ směny</label>
                                        <select value={bulkTypeFilter} onChange={e => setBulkTypeFilter(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 font-bold outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white">
                                            <option value="all">Všechny (Práce, Dovolená, Nemoc)</option><option value="work">Pouze odpracovaná práce</option><option value="vacation">Pouze dovolená</option><option value="sick">Pouze nemocenská</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 mb-2 block tracking-widest">Filtrovat podle smlouvy</label>
                                        <select value={bulkContractFilter} onChange={e => setBulkContractFilter(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 font-bold outline-none focus:ring-2 ring-blue-500 text-slate-900 dark:text-white">
                                            <option value="all">Všechny smlouvy</option><option value="HPP">Pouze Pracovní poměr (HPP)</option><option value="DPČ">Pouze Dohoda DPČ</option><option value="DPP">Pouze Dohoda DPP</option>
                                        </select>
                                    </div>
                                    {bulkStatus && <div className="p-3 bg-blue-50 dark:bg-slate-900/50 rounded-xl text-center text-xs font-bold text-blue-600 dark:text-blue-400">{bulkStatus}</div>}
                                </div>
                                <div className="flex gap-3 mt-6 pt-4 border-t border-slate-100 dark:border-slate-800/60">
                                    <button type="button" onClick={() => { setShowBulkModal(false); setBulkStatus(''); }} className="flex-1 py-4 bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold rounded-2xl active:scale-95 transition-transform shadow-sm">Zrušit</button>
                                    <button type="submit" disabled={bulkLoading} className="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-200 dark:shadow-none active:scale-95 transition-transform flex items-center justify-center gap-2">{bulkLoading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-bolt"></i>}Uplatnit</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
