<body class="bg-slate-100/70 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        // --- Firebase Configuration ---
        const firebaseConfig = {
          apiKey: "AIzaSyDI-epsVMbb2zD-akr72t5SLDoI6M7ieqY",
          authDomain: "wagetracker-cd4c4.firebaseapp.com",
          projectId: "wagetracker-cd4c4",
          storageBucket: "wagetracker-cd4c4.firebasestorage.app",
          messagingSenderId: "899828327925",
          appId: "1:899828327925:web:26d04d30af91b41d09acbc",
          measurementId: "G-1QB8KXD9YW"
        };
        
        let db, auth;
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (e) { console.error("Firebase init failed", e); }

        const { useState, useEffect, useMemo, useRef } = React;

        // --- Czech Holiday Helper ---
        const getCzechHolidays = (year) => {
            const holidays = {
                '01-01': 'Nový rok', '05-01': 'Svátek práce', '05-08': 'Den vítězství',
                '07-05': 'Cyril a Metoděj', '07-06': 'Jan Hus', '09-28': 'Státnost',
                '10-28': 'Vznik ČSR', '11-17': 'Svoboda a demokracie', '12-24': 'Štědrý den',
                '12-25': '1. svátek vánoční', '12-26': '2. svátek vánoční',
            };
            const easter = { 
                2024: ['03-29', '04-01'], 
                2025: ['04-18', '04-21'], 
                2026: ['04-03', '04-06'],
                2027: ['03-26', '03-29']
            };
            const res = { ...holidays };
            if (easter[year]) { 
                res[easter[year][0]] = 'Velký pátek'; 
                res[easter[year][1]] = 'Velikonoční pondělí'; 
            }
            return res;
        };

        // --- Animated Number Ticker Component ---
        const AnimatedNumber = ({ value }) => {
            const [displayValue, setDisplayValue] = useState(0);

            useEffect(() => {
                let startTimestamp = null;
                const duration = 500; 
                const startValue = displayValue;
                const endValue = value;

                if (startValue === endValue) return;

                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const easeProgress = 1 - Math.pow(1 - progress, 4); 
                    setDisplayValue(Math.floor(startValue + (endValue - startValue) * easeProgress));
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        setDisplayValue(endValue);
                    }
                };
                window.requestAnimationFrame(step);
            }, [value]);

            return <span>{displayValue.toLocaleString('cs-CZ')}</span>;
        };

        // --- Toast Notification Component ---
        const Toast = ({ message }) => {
            if (!message) return null;
            return (
                <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 px-5 py-2.5 rounded-full text-xs font-bold shadow-2xl backdrop-blur-md flex items-center gap-2 border border-white/10 dark:border-slate-800/20 animate-fade-in pointer-events-none">
                    <span>{message}</span>
                </div>
            );
        };

        // --- Authentication Screen ---
        const AuthScreen = ({ onLoginSuccess, globalError }) => {
            const [view, setView] = useState('login'); 
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(globalError || '');
            const [loginId, setLoginId] = useState('');
            const [firstName, setFirstName] = useState('');
            const [lastName, setLastName] = useState('');
            const [generatedId, setGeneratedId] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                if (loginId.length !== 8) return setError('ID musí mít 8 číslic.');
                setLoading(true); setError('');
                try {
                    const snap = await db.collection('profiles').doc(loginId).get();
                    if (snap.exists) onLoginSuccess(loginId, snap.data());
                    else setError('Účet neexistuje. Zkus se zaregistrovat.');
                } catch (err) { setError('Chyba spojení s databází.'); }
                setLoading(false);
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!firstName.trim() || !lastName.trim()) return setError('Vyplň jméno a příjmení.');
                setLoading(true); setError('');
                try {
                    const newPin = Math.floor(10000000 + Math.random() * 90000000).toString();
                    const profile = { firstName: firstName.trim(), lastName: lastName.trim(), pin: newPin, createdAt: new Date().toISOString() };
                    await db.collection('profiles').doc(newPin).set(profile);
                    setGeneratedId(newPin); setView('success');
                } catch (err) { setError('Chyba při registraci.'); }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-xl dark:shadow-none p-8 border border-slate-200/60 dark:border-slate-800/80">
                        <div className="flex flex-col items-center mb-8">
                            <div className="bg-gradient-to-tr from-blue-600 to-indigo-600 p-4 rounded-3xl text-white shadow-xl shadow-blue-500/25 mb-4 flex items-center justify-center w-16 h-16">
                                <i className="fa-solid fa-wallet text-[28px]"></i>
                            </div>
                            <h1 className="text-2xl font-black text-slate-800 dark:text-white tracking-tight italic">WageTracker</h1>
                            <p className="text-xs text-slate-400 font-semibold mt-1">Sleduj své směny a výplatu přehledně</p>
                        </div>
                        
                        {error && (
                            <div className="mb-6 p-4 bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 text-xs font-bold rounded-2xl flex gap-2.5 items-center border border-rose-100 dark:border-rose-900/40">
                                <i className="fa-solid fa-circle-exclamation text-sm"></i> <span>{error}</span>
                            </div>
                        )}
                        
                        {view === 'login' && (
                            <form onSubmit={handleLogin} className="space-y-6">
                                <input type="text" name="username" autoComplete="username" value="WageTracker Uživatel" className="hidden" readOnly />
                                <div>
                                    <label className="text-[10px] font-bold uppercase text-slate-400 mb-3 block text-center tracking-widest px-1">Zadej své 8-místné ID</label>
                                    
                                    <div className="relative flex justify-between gap-1 w-full mt-2 group">
                                        {[0,1,2,3,4,5,6,7].map(i => (
                                            <div key={i} className={`w-9 h-14 flex items-center justify-center rounded-2xl text-2xl font-black transition-all duration-200 ${
                                                loginId.length === i 
                                                ? 'ring-2 ring-blue-500 bg-white dark:bg-slate-800 scale-105 z-10 shadow-md' 
                                                : loginId.length > i 
                                                    ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800/50' 
                                                    : 'bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 text-transparent'
                                            }`}>
                                                {loginId[i] ? loginId[i] : ''}
                                            </div>
                                        ))}
                                        <input 
                                            type="password" 
                                            name="password" 
                                            autoComplete="current-password" 
                                            inputMode="numeric" 
                                            pattern="[0-9]*" 
                                            maxLength={8} 
                                            required
                                            value={loginId} 
                                            onChange={e => setLoginId(e.target.value.replace(/\D/g, '').slice(0, 8))} 
                                            className="absolute inset-0 w-full h-full opacity-0 text-transparent bg-transparent caret-transparent outline-none cursor-text z-20"
                                            style={{ WebkitUserSelect: 'text' }}
                                        />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 active:scale-95 transition-all mt-4">
                                    {loading ? <i className="fa-solid fa-spinner fa-spin text-lg"></i> : <i className="fa-solid fa-arrow-right-to-bracket"></i>} PŘIHLÁSIT SE
                                </button>
                                <p className="text-center text-xs text-slate-500 mt-4">Nemáš ještě účet? <button type="button" onClick={() => {setView('register'); setError('')}} className="text-blue-600 dark:text-blue-400 font-bold underline">Zaregistruj se</button></p>
                            </form>
                        )}
                        
                        {view === 'register' && (
                            <form onSubmit={handleRegister} className="space-y-4">
                                <div>
                                    <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-widest pl-1">Jméno</label>
                                    <input type="text" value={firstName} onChange={e => setFirstName(e.target.value)} placeholder="např. Jan" className="w-full font-bold p-4 bg-slate-50 dark:bg-slate-950 rounded-2xl border border-slate-200 dark:border-slate-800 outline-none focus:ring-2 ring-blue-500 text-slate-800 dark:text-slate-100 shadow-sm" required />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold uppercase text-slate-400 mb-1.5 block tracking-widest pl-1">Příjmení</label>
                                    <input type="text" value={lastName} onChange={e => setLastName(e.target.value)} placeholder="např. Novák" className="w-full font-bold p-4 bg-slate-50 dark:bg-slate-950 rounded-2xl border border-slate-200 dark:border-slate-800 outline-none focus:ring-2 ring-blue-500 text-slate-800 dark:text-slate-100 shadow-sm" required />
                                </div>
                                <button type="submit" className="w-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-4 rounded-2xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all mt-4">
                                    {loading ? <i className="fa-solid fa-spinner fa-spin text-lg"></i> : <i className="fa-solid fa-user-plus"></i>} VYTVOŘIT ÚČET
                                </button>
                                <p className="text-center text-xs text-slate-500 mt-4">Již máš ID? <button type="button" onClick={() => {setView('login'); setError('')}} className="text-blue-600 dark:text-blue-400 font-bold underline">Přihlas se</button></p>
                            </form>
                        )}
                        
                        {view === 'success' && (
                            <div className="animate-fade-in flex flex-col items-center text-center w-full">
                                <div className="w-16 h-16 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-500 rounded-full flex items-center justify-center mb-4">
                                    <i className="fa-solid fa-check text-2xl"></i>
                                </div>
                                <h2 className="text-xl font-black text-slate-800 dark:text-white mb-1">Účet byl vytvořen!</h2>
                                <p className="text-xs text-slate-400 mb-5">Tvé unikátní přihlašovací ID:</p>
                                <div className="flex gap-1 justify-center mb-6 w-full">
                                    {generatedId.split('').map((char, i) => (
                                        <div key={i} className="w-9 h-14 flex items-center justify-center rounded-2xl text-2xl font-black bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800/50 shadow-sm">
                                            {char}
                                        </div>
                                    ))}
                                </div>
                                <p className="text-[11px] text-slate-400 mb-6 px-2 leading-relaxed">Ulož si toto ID na bezpečné místo nebo do správce hesel pro budoucí přihlášení.</p>
                                <form onSubmit={(e) => { e.preventDefault(); onLoginSuccess(generatedId, { firstName, lastName }); }} className="w-full">
                                    <input type="text" name="username" autoComplete="username" value={`${firstName} ${lastName}`} className="hidden" readOnly />
                                    <input type="password" name="password" autoComplete="new-password" value={generatedId} className="hidden" readOnly />
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-500/25 active:scale-95 tracking-wider uppercase transition-all">POKRAČOVAT DO APLIKACE</button>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- Shared Month Navigation Bar Component ---
        const MonthPickerBar = ({ currentDate, year, month, isViewingCurrentMonth, setCurrentDate, onPrevMonth, onNextMonth }) => (
            <div className="flex items-center justify-between bg-white dark:bg-slate-900 px-3 py-2.5 rounded-2xl border border-slate-200/70 dark:border-slate-800/80 shadow-sm">
                <button 
                    type="button"
                    onClick={onPrevMonth ? onPrevMonth : () => setCurrentDate(new Date(year, month - 1, 1))} 
                    className="w-9 h-9 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all"
                    title="Předchozí měsíc"
                >
                    <i className="fa-solid fa-chevron-left text-sm"></i>
                </button>
                
                <div className="flex items-center gap-2">
                    <span className="font-extrabold text-sm uppercase tracking-wide text-slate-800 dark:text-slate-100">
                        {new Intl.DateTimeFormat('cs-CZ', { month: 'long', year: 'numeric' }).format(currentDate)}
                    </span>
                    {!isViewingCurrentMonth && (
                        <button 
                            type="button"
                            onClick={() => setCurrentDate(new Date())}
                            className="text-[10px] font-bold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/60 px-2 py-0.5 rounded-lg active:scale-90 border border-blue-200 dark:border-blue-900/50 transition-all"
                        >
                            Dnes
                        </button>
                    )}
                </div>

                <button 
                    type="button"
                    onClick={onNextMonth ? onNextMonth : () => setCurrentDate(new Date(year, month + 1, 1))} 
                    className="w-9 h-9 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-90 transition-all"
                    title="Následující měsíc"
                >
                    <i className="fa-solid fa-chevron-right text-sm"></i>
                </button>
            </div>
        );

        // --- Shared Off-Day Row Component ---
        const OffDayRow = ({ dateStr, isItemToday, holidays, month, onOpenEditor, rowId }) => {
            const dObj = new Date(dateStr + 'T00:00:00');
            const dayName = new Intl.DateTimeFormat('cs-CZ', { weekday: 'short' }).format(dObj);
            const dayNum = dObj.getDate();
            const holKey = `${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
            const hol = holidays?.[holKey];
            const isWk = [0, 6].includes(dObj.getDay());

            return (
                <div 
                    id={rowId}
                    onClick={() => onOpenEditor(dateStr)}

        // --- iOS-Style Swipeable Shift Card (Swipe Left to Delete, Swipe Right to Edit) ---
        const SwipeableShiftCard = ({ 
            s, 
            isItemToday, 
            isRecentlySaved, 
            monthlyData, 
            formatHrs, 
            onOpenEditor, 
            onDeleteShift,
            showOffDaysInList,
            holidays,
            month
        }) => {
            const [offsetX, setOffsetX] = useState(0);
            const [isDragging, setIsDragging] = useState(false);
            const [isDeleting, setIsDeleting] = useState(false);

            const startXRef = useRef(0);
            const startYRef = useRef(0);
            const isSwipingRef = useRef(false);
            const hasMovedRef = useRef(false);

            const shiftUniformPay = (s.type === 'work' && monthlyData.isUniformActive) ? (s.netMinutes / 60) * monthlyData.activeUniformRate : 0;
            const displayTotal = s.gross + shiftUniformPay;

            const handleTouchStart = (e) => {
                if (isDeleting) return;
                startXRef.current = e.touches[0].clientX;
                startYRef.current = e.touches[0].clientY;
                isSwipingRef.current = false;
                hasMovedRef.current = false;
                setIsDragging(true);
            };

            const handleTouchMove = (e) => {
                if (!isDragging || isDeleting) return;
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const diffX = currentX - startXRef.current;
                const diffY = currentY - startYRef.current;

                if (!isSwipingRef.current) {
                    if (Math.abs(diffX) > 7 || Math.abs(diffY) > 7) {
                        if (Math.abs(diffX) > Math.abs(diffY)) {
                            isSwipingRef.current = true;
                            hasMovedRef.current = true;
                        } else {
                            setIsDragging(false);
                            return;
                        }
                    }
                }

                if (isSwipingRef.current) {
                    let dampenedX = diffX;
                    if (diffX < -120) {
                        dampenedX = -120 + (diffX + 120) * 0.35;
                    } else if (diffX > 110) {
                        dampenedX = 110 + (diffX - 110) * 0.35;
                    }
                    setOffsetX(dampenedX);
                }
            };

            const handleTouchEnd = () => {
                if (!isDragging || isDeleting) return;
                setIsDragging(false);

                if (offsetX < -95) {
                    triggerDelete();
                    return;
                }
                if (offsetX > 80) {
                    setOffsetX(0);
                    onOpenEditor(s.date);
                    return;
                }
                if (offsetX < -50) {
                    setOffsetX(-75);
                    return;
                }
                setOffsetX(0);
            };

            const handleMouseDown = (e) => {
                if (isDeleting || e.button !== 0) return;
                startXRef.current = e.clientX;
                startYRef.current = e.clientY;
                isSwipingRef.current = true;
                hasMovedRef.current = false;
                setIsDragging(true);
            };

            const handleMouseMove = (e) => {
                if (!isDragging || isDeleting) return;
                const diffX = e.clientX - startXRef.current;
                const diffY = e.clientY - startYRef.current;

                if (Math.abs(diffX) > 5) {
                    hasMovedRef.current = true;
                    let dampenedX = diffX;
                    if (diffX < -120) {
                        dampenedX = -120 + (diffX + 120) * 0.35;
                    } else if (diffX > 110) {
                        dampenedX = 110 + (diffX - 110) * 0.35;
                    }
                    setOffsetX(dampenedX);
                }
            };

            const handleMouseUp = () => {
                if (!isDragging || isDeleting) return;
                setIsDragging(false);

                if (offsetX < -95) {
                    triggerDelete();
                    return;
                }
                if (offsetX > 80) {
                    setOffsetX(0);
                    onOpenEditor(s.date);
                    return;
                }
                if (offsetX < -50) {
                    setOffsetX(-75);
                    return;
                }
                setOffsetX(0);
            };

            const triggerDelete = () => {
                setIsDeleting(true);
                setOffsetX(-320);
                setTimeout(() => {
                    onDeleteShift(s.date);
                }, 260);
            };

            const handleClick = (e) => {
                if (hasMovedRef.current) {
                    e.stopPropagation();
                    return;
                }
                if (offsetX !== 0) {
                    setOffsetX(0);
                    return;
                }
                onOpenEditor(s.date);
            };

            const editProgress = Math.min(1, Math.max(0, offsetX / 65));
            const deleteProgress = Math.min(1, Math.max(0, -offsetX / 65));

            return (
                <div 
                    id={isItemToday ? 'shift-list-today-row' : undefined}
                    className={`relative overflow-hidden rounded-2xl select-none transition-all duration-300 ${
                        isDeleting 
                            ? (showOffDaysInList ? 'max-h-[60px] opacity-100' : 'max-h-0 opacity-0 !mt-0 -translate-x-full scale-95 pointer-events-none') 
                            : 'max-h-[220px]'
                    }`}
                    style={{ touchAction: 'pan-y' }}
                >
                    {/* Underlying Off-Day row that smoothly stays in place when deleting in "Všechny dny" mode */}
                    {showOffDaysInList && (
                        <div className={`transition-opacity duration-200 ${isDeleting ? 'relative opacity-100 z-10' : 'absolute inset-x-0 top-0 opacity-0 pointer-events-none -z-10'}`}>
                            <OffDayRow 
                                dateStr={s.date}
                                isItemToday={isItemToday}
                                holidays={holidays}
                                month={month}
                                onOpenEditor={onOpenEditor}
                            />
                        </div>
                    )}

                    {/* UNDERLAY: Action Buttons Revealed on Swipe */}
                    {/* Left: Edit Action (revealed when swiping right) */}
                    <div 
                        className={`absolute inset-y-0 left-0 w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-indigo-700 rounded-2xl flex items-center justify-start pl-6 transition-opacity ${
                            offsetX > 5 ? 'opacity-100 z-10' : 'opacity-0 -z-10'
                        }`}
                        onClick={() => { setOffsetX(0); onOpenEditor(s.date); }}
                    >
                        <div 
                            className="flex items-center gap-2 text-white font-black text-xs transition-transform duration-100"
                            style={{
                                transform: `scale(${0.8 + editProgress * 0.35}) translateX(${(editProgress - 1) * -8}px)`
                            }}
                        >
                            <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shadow-xs">
                                <i className="fa-solid fa-pen-to-square text-sm"></i>
                            </div>
                            <span className="uppercase tracking-wider text-[11px]">Upravit</span>
                        </div>
                    </div>

                    {/* Right: Delete Action (revealed when swiping left) */}
                    <div 
                        className={`absolute inset-y-0 right-0 w-full bg-rose-600 dark:bg-rose-700 rounded-2xl flex items-center justify-end pr-6 transition-opacity ${
                            (offsetX < -5 && !isDeleting) ? 'opacity-100 z-10' : 'opacity-0 -z-10'
                        }`}
                        onClick={triggerDelete}
                    >
                        <div 
                            className="flex items-center gap-2 text-white font-black text-xs transition-transform duration-100 cursor-pointer"
                            style={{
                                transform: `scale(${0.8 + deleteProgress * 0.35}) translateX(${(deleteProgress - 1) * 8}px)`
                            }}
                        >
                            <span className="uppercase tracking-wider text-[11px]">Smazat</span>
                            <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shadow-xs">
                                <i className="fa-solid fa-trash-can text-sm"></i>
                            </div>
                        </div>
                    </div>

                    {/* FOREGROUND: Shift Card */}
                    <div 
                        onClick={handleClick}
                        onTouchStart={handleTouchStart}
                        onTouchMove={handleTouchMove}
                        onTouchEnd={handleTouchEnd}
                        onMouseDown={handleMouseDown}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseUp}
                        onMouseLeave={handleMouseUp}
                        style={{
                            transform: `translateX(${offsetX}px)`,
                            transition: isDragging ? 'none' : 'transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease-out',
                            opacity: isDeleting ? 0 : 1
                        }}
                        className={`bg-white dark:bg-slate-900 p-4 rounded-2xl flex flex-col gap-2.5 active:scale-[0.99] cursor-grab active:cursor-grabbing ${
                            isDeleting ? 'absolute inset-x-0 top-0 z-20 pointer-events-none' : 'relative z-20'
                        } ${
                            isRecentlySaved
                                ? 'animate-list-saved'
                                : isItemToday
                                    ? 'border-2 border-indigo-500 dark:border-indigo-400 ring-4 ring-indigo-500/10 shadow-md shadow-indigo-500/10 dark:shadow-indigo-500/20'
                                    : 'border border-slate-200/70 dark:border-slate-800/80 shadow-sm hover:border-blue-400 dark:hover:border-blue-600'
                        }`}
                    >
                        <div className="flex items-center justify-between pointer-events-none">
                            <div className="flex items-center gap-3">
                                <div className={`w-11 h-11 rounded-2xl flex flex-col items-center justify-center shadow-sm ${
                                    isItemToday
                                        ? 'bg-indigo-600 text-white font-black shadow-indigo-500/30'
                                        : s.type === 'vacation' ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600' :
                                          s.type === 'sick' ? 'bg-orange-50 dark:bg-orange-950/40 text-orange-600' :
                                          'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
                                }`}>
                                    <span className={`text-[8px] font-bold uppercase leading-none ${isItemToday ? 'text-indigo-100' : ''}`}>
                                        {new Intl.DateTimeFormat('cs-CZ', { weekday: 'short' }).format(new Date(s.date))}
                                    </span>
                                    <span className="text-base font-black mt-0.5">{new Date(s.date).getDate()}</span>
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <p className="font-bold text-sm text-slate-800 dark:text-slate-100">
                                            {s.type === 'vacation' ? 'Dovolená' : s.type === 'sick' ? 'Nemocenská' : s.raw}
                                        </p>
                                        <span className="text-[9px] px-1.5 py-0.5 bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-md font-bold">
                                            {s.contractType || 'HPP'}
                                        </span>
                                        {isItemToday && (
                                            <span className="text-[9px] px-2 py-0.5 bg-indigo-600 text-white rounded-md font-black tracking-wide flex items-center gap-1 shadow-xs">
                                                <i className="fa-solid fa-calendar-day text-[8px]"></i> Dnes
                                            </span>
                                        )}
                                    </div>
                                    <p className="text-[10px] font-bold text-slate-400 mt-0.5">
                                        {formatHrs(s.netMinutes)} • {s.rate} Kč/h 
                                        {(s.type === 'work' && monthlyData.isUniformActive) ? ` (+${monthlyData.activeUniformRate} uniforma)` : ''}
                                    </p>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-sm font-black text-slate-900 dark:text-white">
                                    {Math.round(displayTotal).toLocaleString('cs-CZ')} Kč
                                </p>
                                <span className="text-[9px] text-slate-400 font-semibold">hrubá</span>
                            </div>
                        </div>
                        
                        {(s.type === 'work' && (s.nBonus > 0 || s.wBonus > 0 || s.hBonus > 0 || shiftUniformPay > 0)) && (
                            <div className="flex flex-wrap gap-1.5 border-t border-slate-100 dark:border-slate-800/60 pt-2 pointer-events-none">
                                {s.nBonus > 0 && (
                                    <div className="flex items-center gap-1 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded-lg text-[9px] font-bold border border-indigo-100 dark:border-indigo-900/40">
                                        <i className="fa-solid fa-bolt text-[8px]"></i> +{Math.round(s.nBonus)} Kč noc
                                    </div>
                                )}
                                {s.wBonus > 0 && (
                                    <div className="flex items-center gap-1 bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 px-2 py-0.5 rounded-lg text-[9px] font-bold border border-amber-100 dark:border-amber-900/40">
                                        <i className="fa-solid fa-star text-[8px]"></i> +{Math.round(s.wBonus)} Kč víkend
                                    </div>

                                {s.hBonus > 0 && (

                                        <i className="fa-solid fa-champagne-glasses text-[8px]"></i> +{Math.round(s.hBonus)} Kč svátek
                                    </div>
                                )}
                                {shiftUniformPay > 0 && (

                                        <i className="fa-solid fa-shirt text-[8px]"></i> +{Math.round(shiftUniformPay)} Kč uniforma
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- Main WageTracker Application ---
        const App = () => {
            const [isInitializing, setIsInitializing] = useState(true);

            const [endMin, setEndMin] = useState('');
            
            const [breakValue, setBreakValue] = useState('');
            const [hoursValue, setHoursValue] = useState('8');
            const [rateValue, setRateValue] = useState('0');
            const [shiftContract, setShiftContract] = useState('HPP');
            const [initialEditorValues, setInitialEditorValues] = useState(null);
            const [pendingEditorNav, setPendingEditorNav] = useState(null); // null | 'close' | { type: 'day', delta: number }

            const [showBulkModal, setShowBulkModal] = useState(false);
            const [bulkRate, setBulkRate] = useState('');
            const [bulkTypeFilter, setBulkTypeFilter] = useState('all');
            const [bulkContractFilter, setBulkContractFilter] = useState('all');
            const [bulkLoading, setBulkLoading] = useState(false);
            const [bulkStatus, setBulkStatus] = useState('');
            const [swipeDirection, setSwipeDirection] = useState(null); // 'left' | 'right' | null
            const [collapsedPayslipSections, setCollapsedPayslipSections] = useState({

            const [statsHeatmapView, setStatsHeatmapView] = useState('month'); // 'month' | 'year'

            const touchStartX = useRef(0);
            const touchEndX = useRef(0);
            const touchStartY = useRef(0);
            const touchEndY = useRef(0);
            const swipeDistance = useRef(0);

            // Export přehledu a konfigurace zprávy
            const [showExportModal, setShowExportModal] = useState(false);
            const [exportFormat, setExportFormat] = useState('text'); // 'text' | 'compact' | 'csv'
            const [exportConfig, setExportConfig] = useState({

            const [showCelebration, setShowCelebration] = useState(false);
            const [collapsedWeeks, setCollapsedWeeks] = useState({});

            // Živý časovač pro plynulou aktualizaci statistik každých 200 ms
            useEffect(() => {

                    setNowTick(Date.now());

            const showToast = (msg) => {

                customUniformRates: {}, 
                quarterlyAverages: {

                    '2025-Q1': 145.00, '2025-Q2': 145.00, '2025-Q3': 145.00, '2025-Q4': 145.00,

                },

            });

            const contractLabels = { 'HPP': 'Pracovní poměr (HPP)', 'DPČ': 'Dohoda DPČ', 'DPP': 'Dohoda DPP' };

            // Dynamické chytré předvolby podle reálné historie uživatelových směn
            const smartPresets = useMemo(() => {
                const shiftCounts = {};
                const sortedDates = Object.keys(shifts).sort().reverse();
                
                sortedDates.forEach(dateStr => {
                    const s = shifts[dateStr];

                        const cleanRaw = s.raw.replace(/\s/g, '');

                        shiftCounts[cleanRaw].count += 1;

                const sortedShifts = Object.values(shiftCounts).sort((a, b) => {

                        try {

                                db.collection('profiles').doc(activePin).get(),
                                db.collection('settings').doc(activePin).get()
                            ]);
                            if (pSnap.exists) setProfileName(`${pSnap.data().firstName} ${pSnap.data().lastName}`);
                            if (sSnap.exists) setSettings(prev => ({ ...prev, ...sSnap.data() }));

                            // Initial one-time get for shifts so the app never shows empty before first render
                            const initialShiftsSnap = await db.collection(`shifts_${activePin}`).get();
                            const initialData = {};
                            initialShiftsSnap.forEach(d => { initialData[d.id] = d.data(); });
                            setShifts(initialData);

                            // Real-time snapshot listener for subsequent updates
                            db.collection(`shifts_${activePin}`).onSnapshot(snap => {
                                const data = {}; snap.forEach(d => data[d.id] = d.data()); setShifts(data);
                            }, err => { setGlobalError('Chyba databáze.'); });
                        } catch (err) {
                            console.error('Initialization error:', err);
                        }
                    }
                    setIsInitializing(false);
                }).catch(e => { setGlobalError(e.message); setIsInitializing(false); });
            }, [activePin]);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', settings.isDark);
                localStorage.setItem('shift-theme', settings.isDark ? 'dark' : 'light');
            }, [settings.isDark]);

            useEffect(() => {
                if (settings.liveShiftEnabled === false && activeTab === 'live') {
                    setActiveTab('calendar');
                }
            }, [settings.liveShiftEnabled, activeTab]);

            // Zamezení scrollování stránky/pozadí při otevřeném dialogu/modalu
            useEffect(() => {
                const isAnyModalOpen = Boolean(editingDate || selectedDaySummary || showBulkModal || showExportModal || pendingEditorNav);

                }
                return () => {
                    document.body.classList.remove('modal-open');
                };
            }, [editingDate, selectedDaySummary, showBulkModal, showExportModal, pendingEditorNav]);

            const saveSettings = async (newSettings) => {
                setSettings(newSettings);
                if (activePin) await db.collection('settings').doc(activePin).set(newSettings);
            };

            const handleLoginSuccess = (pin, pData) => {
                localStorage.setItem('wage-tracker-pin', pin); setActivePin(pin);
                if (pData) setProfileName(`${pData.firstName} ${pData.lastName}`);
            };

            const handleLogout = () => { 
                localStorage.removeItem('wage-tracker-pin'); 
                setActivePin(null); 
            };

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const holidays = useMemo(() => getCzechHolidays(year), [year]);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;
            const trailingOffset = (7 - ((startOffset + daysInMonth) % 7)) % 7;

            const isViewingCurrentMonth = useMemo(() => {
                const now = new Date();
                return now.getFullYear() === year && now.getMonth() === month;
            }, [year, month]);

            const todayStr = useMemo(() => {
                const now = new Date(nowTick);
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            }, [nowTick]);

            // Formátování hodin striktně na 2 desetinná místa
            const formatHrs = (m) => `${(m/60).toLocaleString('cs-CZ', {minimumFractionDigits: 2, maximumFractionDigits: 2})}h`;

            const getQuarterKeyForDateStr = (dateStr) => {
                if (!dateStr) return '';
                const parts = dateStr.split('-');
                if (parts.length >= 2) {
                    const y = parts[0];
                    const m = parseInt(parts[1], 10);
                    const q = Math.ceil(m / 3);
                    return `${y}-Q${q}`;
                }
                const dObj = new Date(dateStr);
                const q = Math.floor(dObj.getMonth() / 3) + 1;
                return `${dObj.getFullYear()}-Q${q}`;
            };

            // Detekce právě probíhající směny v reálném čase
            const currentActiveShift = useMemo(() => {
                if (settings.liveShiftEnabled === false) return null;
                const now = new Date(nowTick);
                
                // Demo režim pro testování a motivaci kdykoliv
                if (demoLiveMode) {
                    const mockStart = new Date(now.getTime() - (4 * 3600 + 32 * 60 + 15) * 1000);
                    const mockEnd = new Date(now.getTime() + (3 * 3600 + 27 * 60 + 45) * 1000);
                    const rate = settings.defaultRate || 180;
                    return {
                        isDemo: true,
                        dateStr: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`,
                        raw: `${String(mockStart.getHours()).padStart(2, '0')}:${String(mockStart.getMinutes()).padStart(2, '0')} - ${String(mockEnd.getHours()).padStart(2, '0')}:${String(mockEnd.getMinutes()).padStart(2, '0')}`,
                        startTime: mockStart,
                        endTime: mockEnd,
                        rate: rate,
                        breakMinutes: 30,
                        contractType: settings.defaultContract || 'HPP',
                        type: 'work'
                    };
                }

                const pad = (n) => String(n).padStart(2, '0');
                const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
                const yesterdayDate = new Date(now.getTime() - 86400000);
                const yesterdayStr = `${yesterdayDate.getFullYear()}-${pad(yesterdayDate.getMonth() + 1)}-${pad(yesterdayDate.getDate())}`;

                const candidates = [todayStr, yesterdayStr];

                for (const dStr of candidates) {
                    const s = shifts[dStr];
                    if (!s || s.type !== 'work' || !s.raw || !s.raw.includes('-')) continue;

                    const parts = s.raw.replace(/\s/g, '').split('-');
                    if (parts.length !== 2) continue;
                    const p1 = parts[0].split(':').map(Number);
                    const p2 = parts[1].split(':').map(Number);
                    if (isNaN(p1[0]) || isNaN(p2[0])) continue;

                    const [sh, sm = 0] = p1;
                    const [eh, em = 0] = p2;

                    const [y, m, d] = dStr.split('-').map(Number);
                    const startTime = new Date(y, m - 1, d, sh, sm, 0, 0);
                    let endTime = new Date(y, m - 1, d, eh, em, 0, 0);

                    // Směna přes půlnoc
                    if (eh * 60 + em <= sh * 60 + sm) {
                        endTime = new Date(endTime.getTime() + 86400000);
                    }

                    if (now >= startTime && now < endTime) {
                        return {
                            isDemo: false,
                            dateStr: dStr,
                            raw: s.raw,
                            startTime,
                            endTime,
                            rate: s.rate || settings.defaultRate || 180,
                            breakMinutes: s.breakMinutes !== undefined ? s.breakMinutes : 30,
                            contractType: s.contractType || 'HPP',
                            type: 'work',
                            shiftData: s
                        };
                    }
                }

                return null;
            }, [nowTick, demoLiveMode, shifts, settings]);

            // Živé statistiky směny aktualizované plynule každých 200 ms
            const liveShiftStats = useMemo(() => {
                if (!currentActiveShift) return null;

                const now = new Date(nowTick);
                const start = currentActiveShift.startTime;
                const end = currentActiveShift.endTime;

                const totalSeconds = Math.max(1, (end.getTime() - start.getTime()) / 1000);
                const elapsedSecondsExact = Math.max(0, Math.min(totalSeconds, (now.getTime() - start.getTime()) / 1000));
                const elapsedSeconds = Math.floor(elapsedSecondsExact);
                const remainingSeconds = Math.max(0, Math.ceil(totalSeconds - elapsedSecondsExact));

                const progressPct = Math.min(100, Math.max(0, (elapsedSecondsExact / totalSeconds) * 100));

                const formatDuration = (sec) => {
                    const h = Math.floor(sec / 3600);
                    const m = Math.floor((sec % 3600) / 60);
                    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                };

                const breakMinutes = currentActiveShift.breakMinutes || 0;
                const breakSeconds = breakMinutes * 60;
                const netWorkingSeconds = Math.max(1, totalSeconds - breakSeconds);
                const workedHoursTotal = netWorkingSeconds / 3600;

                const hourlyRate = currentActiveShift.rate;
                const monthKey = `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}`;
                const isUniformActive = settings.uniformEnabled && !settings.disabledUniformMonths?.[monthKey];
                const uniformRate = settings.customUniformRates?.[monthKey] !== undefined ? settings.customUniformRates[monthKey] : (parseFloat(settings.uniformRate) || 0);

                // Kontrola průměru na dovolenou / příplatky (pokud je zapnuta v nastavení)
                const qKey = getQuarterKeyForDateStr(currentActiveShift.dateStr);
                const qAverage = settings.quarterlyAverages?.[qKey];
                const premiumBaseRate = (settings.useAverageForPremiums && qAverage > 0) ? parseFloat(qAverage) : hourlyRate;

                // --- 1. AKTUÁLNÍ MOMENT (Sazba v této přesné vteřině se všemi příplatky vč. uniformy) ---
                const currentHour = now.getHours();
                const isNightNow = currentHour >= 22 || currentHour < 6;
                const isWeekendNow = [0, 6].includes(now.getDay());
                const holKey = `${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const isHolidayNow = !!holidays[holKey];

                let currentMomentGrossHourly = hourlyRate;
                if (isNightNow) currentMomentGrossHourly += premiumBaseRate * ((settings.bonuses.night || 0) / 100);
                if (isWeekendNow) currentMomentGrossHourly += premiumBaseRate * ((settings.bonuses.weekend || 0) / 100);
                if (isHolidayNow) currentMomentGrossHourly += premiumBaseRate * ((settings.bonuses.holiday || 0) / 100);
                if (isUniformActive) currentMomentGrossHourly += uniformRate;

                // --- 2. DYNAMICKÝ VÝPOČET HISTORIE SMĚNY PO MINUTÁCH ---
                // Zjištění celkových minut směny a rozpadu (den / noc / víkend / svátek)
                const totalMinutes = Math.floor(totalSeconds / 60);
                const elapsedMinutes = Math.min(totalMinutes, Math.floor(elapsedSecondsExact / 60));
                const currentFractionOfMinute = (elapsedSecondsExact % 60) / 60;

                // Analýza každé minuty celé směny
                let shiftDayMins = 0;
                let shiftNightMins = 0;
                let shiftWeekendMins = 0;
                let shiftHolidayMins = 0;

                // Analýza odpracovaných minut do teď
                let elapsedDayMins = 0;
                let elapsedNightMins = 0;
                let elapsedWeekendMins = 0;
                let elapsedHolidayMins = 0;

                for (let i = 0; i < totalMinutes; i++) {
                    const minDate = new Date(start.getTime() + (i * 60 * 1000));
                    const h = minDate.getHours();
                    const isMinNight = (h >= 22 || h < 6);
                    const isMinWk = [0, 6].includes(minDate.getDay());
                    const mHolKey = `${String(minDate.getMonth()+1).padStart(2, '0')}-${String(minDate.getDate()).padStart(2, '0')}`;
                    const isMinHol = !!holidays[mHolKey];

                    if (isMinNight) shiftNightMins++; else shiftDayMins++;
                    if (isMinWk) shiftWeekendMins++;
                    if (isMinHol) shiftHolidayMins++;

                    if (i < elapsedMinutes) {
                        if (isMinNight) elapsedNightMins++; else elapsedDayMins++;
                        if (isMinWk) elapsedWeekendMins++;
                        if (isMinHol) elapsedHolidayMins++;
                    }
                }

                // Zákonné odečtení neplacené pauzy primárně z denní části
                const shiftBreakRemaining = Math.max(0, breakMinutes - shiftDayMins);
                const totalShiftNightMins = Math.max(0, shiftNightMins - shiftBreakRemaining);
                const totalShiftNetMins = Math.max(0, totalMinutes - breakMinutes);
                const totalShiftWkMins = (shiftWeekendMins / Math.max(1, totalMinutes)) * totalShiftNetMins;
                const totalShiftHolMins = (shiftHolidayMins / Math.max(1, totalMinutes)) * totalShiftNetMins;

                // Odpracovaná pauza do teď
                const elapsedBreakPaidSoFar = Math.min(breakMinutes, elapsedMinutes);
                const elapsedBreakRemaining = Math.max(0, elapsedBreakPaidSoFar - elapsedDayMins);
                const elapsedNetNightMins = Math.max(0, elapsedNightMins - elapsedBreakRemaining);
                const elapsedNetTotalMins = Math.max(0, elapsedMinutes - elapsedBreakPaidSoFar);

                // Složky vydělané do teď (přesně dynamicky)
                const earnedBaseGross = (elapsedNetTotalMins / 60) * hourlyRate;
                const earnedNightGross = (elapsedNetNightMins / 60) * premiumBaseRate * ((settings.bonuses.night || 0) / 100);
                const earnedWeekendGross = (elapsedMinutes > 0 ? (elapsedWeekendMins / elapsedMinutes) * elapsedNetTotalMins / 60 : 0) * premiumBaseRate * ((settings.bonuses.weekend || 0) / 100);
                const earnedHolidayGross = (elapsedMinutes > 0 ? (elapsedHolidayMins / elapsedMinutes) * elapsedNetTotalMins / 60 : 0) * premiumBaseRate * ((settings.bonuses.holiday || 0) / 100);
                const earnedUniform = isUniformActive ? ((elapsedNetTotalMins / 60) * uniformRate) : 0;

                // Přidání frakce aktuální vteřiny (podle aktuální sazby v tomto momentu)
                const currentMomentRatePerSec = currentMomentGrossHourly / 3600;
                const currentFractionEarned = currentFractionOfMinute * 60 * currentMomentRatePerSec;

                const earnedGross = earnedBaseGross + earnedNightGross + earnedWeekendGross + earnedHolidayGross + earnedUniform + currentFractionEarned;

                // Celkové očekávané složky za celou směnu
                const totalBaseGross = (totalShiftNetMins / 60) * hourlyRate;
                const totalNightGross = (totalShiftNightMins / 60) * premiumBaseRate * ((settings.bonuses.night || 0) / 100);
                const totalWeekendGross = (totalShiftWkMins / 60) * premiumBaseRate * ((settings.bonuses.weekend || 0) / 100);
                const totalHolidayGross = (totalShiftHolMins / 60) * premiumBaseRate * ((settings.bonuses.holiday || 0) / 100);
                const totalUniformGross = isUniformActive ? ((totalShiftNetMins / 60) * uniformRate) : 0;
                const totalExpectedGross = totalBaseGross + totalNightGross + totalWeekendGross + totalHolidayGross + totalUniformGross;

                // Odhad čisté mzdy
                const isHpp = currentActiveShift.contractType === 'HPP';
                const netRatio = isHpp ? 0.81 : (currentActiveShift.contractType === 'DPP' ? 0.85 : 0.79);
                const earnedNet = (earnedGross - earnedUniform) * netRatio + earnedUniform;
                const totalExpectedNet = (totalExpectedGross - totalUniformGross) * netRatio + totalUniformGross;

                // Ekvivalenty
                const beersEarned = (earnedGross / 55);
                const petShopsEarned = (earnedGross / 150);
                const lunchesEarned = (earnedGross / 185);
                const fuelLiters = (earnedGross / 38);

                const hasNightInShift = totalShiftNightMins > 0;
                const hasWeekendInShift = shiftWeekendMins > 0;
                const hasHolidayInShift = shiftHolidayMins > 0;

                return {
                    now,
                    start,
                    end,
                    totalSeconds,
                    elapsedSeconds,
                    elapsedSecondsExact,
                    remainingSeconds,
                    progressPct,
                    elapsedFormatted: formatDuration(elapsedSeconds),
                    remainingFormatted: formatDuration(remainingSeconds),
                    hourlyRate,
                    workedHoursTotal,
                    currentMomentGrossHourly,
                    earnedGross,
                    earnedNet,
                    totalExpectedGross,
                    totalExpectedNet,
                    isNightNow,
                    isWeekendNow,
                    isHolidayNow,
                    hasNightInShift,
                    hasWeekendInShift,
                    hasHolidayInShift,
                    earnedBaseGross,
                    totalBaseGross,
                    earnedNightGross,
                    totalNightGross,
                    earnedWeekendGross,
                    totalWeekendGross,
                    earnedHolidayGross,
                    totalHolidayGross,
                    earnedUniform,
                    totalUniformGross,
                    isUniformActive,
                    uniformRate,
                    beersEarned,
                    petShopsEarned,
                    lunchesEarned,
                    fuelLiters
                };
            }, [nowTick, currentActiveShift, settings, holidays]);

            // Dynamic Duration Calculation for Live Editor
            const liveDuration = useMemo(() => {
                if (editorType !== 'work') return null;
                if (startHour === '' || endHour === '') return null;
                
                const sh = parseInt(startHour, 10) || 0;
                const sm = startMin !== '' ? (parseInt(startMin, 10) || 0) : 0;
                const eh = parseInt(endHour, 10) || 0;
                const em = endMin !== '' ? (parseInt(endMin, 10) || 0) : 0;
                
                const startTotal = sh * 60 + sm;
                const endTotal = eh * 60 + em;
                let diff = endTotal - startTotal;
                if (diff < 0) diff += 1440; 

                let breakMins = breakValue !== '' ? parseInt(breakValue, 10) : (diff > 360 ? 30 : 0);
                if (isNaN(breakMins)) breakMins = 0;
                let net = Math.max(0, diff - breakMins);

                const hours = Math.floor(net / 60);
                const mins = net % 60;

                return { netHours: hours, netMins: mins, breakMins, netTotalMins: net };
            }, [startHour, startMin, endHour, endMin, breakValue, editorType]);

            // Advanced Salary Calculations
            const calculateShiftDetails = (startMin, endMin, customBreak, rate, dateStr, type, fixedHours) => {
                if (type !== 'work') {
                    return { 
                        type, netMinutes: fixedHours * 60, base: fixedHours * rate, 
                        gross: type === 'vacation' ? fixedHours * rate : fixedHours * rate * 0.6, 
                        breakMinutes: 0, raw: `${fixedHours}h`, nBonus: 0, wBonus: 0, hBonus: 0,
                        nightHrs: 0, weekendHrs: 0, holidayHrs: 0
                    };
                }

                let diff = endMin - startMin; if (diff < 0) diff += 1440;
                let breakMins = customBreak !== '' ? parseInt(customBreak, 10) : (diff > 360 ? 30 : 0);
                if (isNaN(breakMins)) breakMins = 0;
                let net = Math.max(0, diff - breakMins);
                
                const dObj = new Date(dateStr + 'T00:00:00'); 
                const isWk = [0, 6].includes(dObj.getDay());
                const dYear = dObj.getFullYear();
                const dMonth = dObj.getMonth();
                const dateHolidays = dYear === year ? holidays : getCzechHolidays(dYear);
                const isHol = !!dateHolidays[`${String(dMonth + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`];
                
                // Pauza calculation
                let rawNightMins = 0; 
                let rawDayMins = 0;
                for (let i = 0; i < diff; i++) { 
                    const cur = (startMin + i) % 1440; 
                    if (cur >= 1320 || cur < 360) rawNightMins++; 
                    else rawDayMins++;
                }
                
                let remainingBreak = Math.max(0, breakMins - rawDayMins);
                const nightMinutes = Math.max(0, rawNightMins - remainingBreak);
                
                const weekendMinutes = isWk ? net : 0;
                const holidayMinutes = isHol ? net : 0;

                const qKey = getQuarterKeyForDateStr(dateStr);
                const qAverage = settings.quarterlyAverages?.[qKey];
                const premiumBaseRate = (settings.useAverageForPremiums && qAverage > 0) ? parseFloat(qAverage) : rate;

                const base = (net / 60) * rate;
                const nB = (nightMinutes / 60) * premiumBaseRate * (settings.bonuses.night / 100);
                const wB = isWk ? (net / 60) * premiumBaseRate * (settings.bonuses.weekend / 100) : 0;
                const hB = isHol ? (net / 60) * premiumBaseRate * (settings.bonuses.holiday / 100) : 0;

                return { 
                    type: 'work', netMinutes: net, base, nBonus: nB, wBonus: wB, hBonus: hB, 
                    gross: base + nB + wB + hB, breakMinutes: breakMins,
                    nightHrs: nightMinutes / 60, weekendHrs: weekendMinutes / 60, holidayHrs: holidayMinutes / 60 
                };
            };

            // Live Earnings & Bonuses Preview for Shift Editor Modal
            const liveShiftPreview = useMemo(() => {
                if (!editingDate) return null;
                const rate = parseFloat(rateValue) || settings.defaultRate || 0;
                const dObj = new Date(editingDate + 'T00:00:00');
                const mKey = `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}`;
                const isUniformActiveForDate = settings.uniformEnabled && !(settings.disabledUniformMonths?.[mKey] === true);
                const activeUniformRateForDate = settings.customUniformRates?.[mKey] !== undefined
                    ? settings.customUniformRates[mKey]
                    : (parseFloat(settings.uniformRate) || 0);

                if (editorType !== 'work') {
                    const fHours = parseFloat(hoursValue) || 0;
                    if (fHours <= 0) return null;
                    const details = calculateShiftDetails(0, 0, '', rate, editingDate, editorType, fHours);
                    return {
                        ...details,
                        netHours: Math.floor(details.netMinutes / 60),
                        netMins: Math.round(details.netMinutes % 60),
                        breakMins: 0,
                        uniformBonus: 0,
                        totalWithUniform: details.gross
                    };
                }

                if (startHour === '' || endHour === '') return null;
                const sh = parseInt(startHour, 10) || 0;
                const sm = startMin !== '' ? (parseInt(startMin, 10) || 0) : 0;
                const eh = parseInt(endHour, 10) || 0;
                const em = endMin !== '' ? (parseInt(endMin, 10) || 0) : 0;
                const startTotal = sh * 60 + sm;
                const endTotal = eh * 60 + em;

                const details = calculateShiftDetails(startTotal, endTotal, breakValue, rate, editingDate, 'work', 8);
                const uniformBonus = isUniformActiveForDate ? (details.netMinutes / 60) * activeUniformRateForDate : 0;

                return {
                    ...details,
                    netHours: Math.floor(details.netMinutes / 60),
                    netMins: Math.round(details.netMinutes % 60),
                    breakMins: details.breakMinutes,
                    uniformBonus,
                    totalWithUniform: details.gross + uniformBonus
                };
            }, [editingDate, editorType, startHour, startMin, endHour, endMin, breakValue, rateValue, hoursValue, settings, holidays, year]);

            const handleSaveShift = async (saveAndNext = false) => {
                if (!editingDate) return;
                const targetDate = editingDate;
                const rate = parseFloat(rateValue) || settings.defaultRate;
                let start = 0, end = 0, fHours = 8;
                let rawStr = '';
                if (editorType === 'work') {
                    const sh = startHour === '' ? 8 : (parseInt(startHour, 10) || 0);
                    const sm = startMin === '' ? 0 : (parseInt(startMin, 10) || 0);
                    const eh = endHour === '' ? 16 : (parseInt(endHour, 10) || 0);
                    const em = endMin === '' ? 0 : (parseInt(endMin, 10) || 0);
                    start = sh * 60 + sm;
                    end = eh * 60 + em;
                    rawStr = `${String(sh).padStart(2, '0')}:${String(sm).padStart(2, '0')}-${String(eh).padStart(2, '0')}:${String(em).padStart(2, '0')}`;
                } else {
                    fHours = parseFloat(hoursValue);
                    rawStr = `${fHours}h`;
                }
                const details = calculateShiftDetails(start, end, breakValue, rate, targetDate, editorType, fHours);

                // Zajištění, že kalendář zobrazuje měsíc nově uložené směny
                const sDate = new Date(targetDate + 'T00:00:00');
                if (sDate.getFullYear() !== year || sDate.getMonth() !== month) {
                    setCurrentDate(new Date(sDate.getFullYear(), sDate.getMonth(), 1));
                }

                if (saveAndNext) {
                    setPendingEditorNav(null);
                    navigateEditorDayDirect(1);
                } else {
                    // Zavřeme editor okamžitě – zabrání probliknutí ikony koše a zpoždění
                    setEditingDate(null);
                    setPendingEditorNav(null);
                }

                // Spuštění animace přidání směny do kalendáře
                setRecentlySavedDate(targetDate);
                setTimeout(() => {
                    setRecentlySavedDate(prev => prev === targetDate ? null : prev);
                }, 2200);

                showToast(saveAndNext ? 'Uloženo! Přechod na další den ➜' : 'Směna úspěšně uložena ✓');

                try {
                    await db.collection(`shifts_${activePin}`).doc(targetDate).set({ ...details, raw: rawStr, rate, contractType: shiftContract });
                } catch (err) {
                    console.error('Error saving shift:', err);
                    showToast('Chyba při ukládání do databáze');
                }
            };

            const deleteShiftByDate = async (dateStr) => {
                if (!dateStr || !activePin) return;
                try {
                    await db.collection(`shifts_${activePin}`).doc(dateStr).delete();
                    showToast('Směna byla smazána 🗑️');
                } catch (err) {
                    console.error('Error deleting shift:', err);
                    showToast('Chyba při mazání směny');
                }
            };

            const handleDeleteShift = async () => {
                if (!editingDate) return;
                const dateToDelete = editingDate;
                setEditingDate(null);
                await deleteShiftByDate(dateToDelete);
            };

            const handleBulkRateUpdate = async (e) => {
                e.preventDefault();
                const newRate = parseFloat(bulkRate);
                if (isNaN(newRate) || newRate <= 0) return setBulkStatus('Chyba: Zadej platnou číselnou sazbu.');
                setBulkLoading(true); setBulkStatus('Přepočítávám a ukládám...');

                try {
                    const monthPrefix = `${year}-${String(month+1).padStart(2, '0')}`;
                    const targetDates = Object.keys(shifts).filter(dateStr => {
                        if (!dateStr.startsWith(monthPrefix)) return false;
                        const s = shifts[dateStr];
                        if (bulkTypeFilter !== 'all' && s.type !== bulkTypeFilter) return false;
                        if (bulkContractFilter !== 'all' && (s.contractType || 'HPP') !== bulkContractFilter) return false;
                        return true;
                    });

                    if (targetDates.length === 0) { setBulkStatus('Nebyly nalezeny žádné odpovídající směny.'); setBulkLoading(false); return; }

                    const batch = db.batch();
                    targetDates.forEach(dateStr => {
                        const s = shifts[dateStr];
                        let start = 0, end = 0;
                        if (s.type === 'work' && s.raw) {
                            const parts = s.raw.replace(/\s/g, '').split('-');
                            if (parts.length === 2) {
                                const toMin = (t) => { let [h, m] = t.split(':').map(Number); return h * 60 + (isNaN(m) ? 0 : m); };
                                start = toMin(parts[0]); end = toMin(parts[1]);
                            }
                        }
                        const fHours = s.netMinutes / 60;
                        const details = calculateShiftDetails(start, end, s.breakMinutes !== undefined ? s.breakMinutes.toString() : '', newRate, dateStr, s.type, fHours);
                        batch.set(db.collection(`shifts_${activePin}`).doc(dateStr), { ...s, ...details, rate: newRate }, { merge: true });
                    });

                    await batch.commit();
                    setBulkStatus(`Úspěšně upraveno ${targetDates.length} směn.`);
                    showToast(`Sazba změněna u ${targetDates.length} směn ✓`);
                    setTimeout(() => { setShowBulkModal(false); setBulkStatus(''); setBulkRate(''); }, 1200);
                } catch (err) { setBulkStatus('Chyba databáze.'); }
                setBulkLoading(false);
            };

            // Univerzální výpočet měsíčních ukazatelů pro libovolný měsíc a rok
            const computeMonthlyMetrics = (targetYear, targetMonth) => {
                const monthKey = `${targetYear}-${String(targetMonth + 1).padStart(2, '0')}`;
                const list = Object.keys(shifts).filter(k => k.startsWith(monthKey)).sort().map(k => ({ date: k, ...shifts[k] }));
                const groups = { HPP: { gross: 0, hrs: 0, workHrs: 0, base: 0 }, DPČ: { gross: 0, hrs: 0, workHrs: 0, base: 0 }, DPP: { gross: 0, hrs: 0, workHrs: 0, base: 0 } };
                let nB = 0, wB = 0, hB = 0, baseW = 0, sickW = 0, vacW = 0, workHrs = 0;
                let nHrs = 0, wHrs = 0, hHrs = 0;

                let yearlyDPPHrs = 0;
                Object.keys(shifts).forEach(k => {
                    if (k.startsWith(`${targetYear}-`)) {
                        const s = shifts[k];
                        if (s.contractType === 'DPP' && s.type === 'work') yearlyDPPHrs += s.netMinutes / 60;
                    }
                });
                
                list.forEach(s => {
                    const t = s.contractType || 'HPP'; if (!groups[t]) return;
                    groups[t].gross += s.gross; groups[t].hrs += s.netMinutes/60;
                    if (s.type === 'sick') sickW += s.gross;
                    else if (s.type === 'vacation') vacW += s.gross;
                    else { 
                        nB += (s.nBonus||0); wB += (s.wBonus||0); hB += (s.hBonus||0); 
                        nHrs += (s.nightHrs||0); wHrs += (s.weekendHrs||0); hHrs += (s.holidayHrs||0);
                        baseW += (s.base||0); workHrs += (s.netMinutes/60); 
                        groups[t].workHrs += (s.netMinutes/60); groups[t].base += (s.base||0);
                    }
                });

                const isUniformDisabledThisMonth = settings.disabledUniformMonths?.[monthKey] === true;
                const isUniformActive = settings.uniformEnabled && !isUniformDisabledThisMonth;
                const activeUniformRate = settings.customUniformRates?.[monthKey] !== undefined ? settings.customUniformRates[monthKey] : (parseFloat(settings.uniformRate) || 0);
                const uniformPay = isUniformActive ? (workHrs * activeUniformRate) : 0;

                let totalSoc = 0, totalZdra = 0, rawTax = 0, totalTaxableGross = 0;
                Object.keys(groups).forEach(t => {
                    const g = groups[t]; if (g.gross <= 0) return; 
                    totalTaxableGross += g.gross;
                    const roundedGrossForTax = Math.ceil(g.gross / 100) * 100;

                    if (t === 'HPP' || (t === 'DPP' && g.gross > 10500) || (t === 'DPČ' && g.gross >= 4000)) { 
                        totalSoc += g.gross * 0.071; totalZdra += g.gross * 0.045; rawTax += roundedGrossForTax * 0.15; 
                    } else rawTax += g.gross * 0.15; 
                });

                const sleva = Number(settings.discounts?.taxpayer || 0) + Number(settings.discounts?.kids || 0);
                const finalTax = Math.max(0, rawTax - sleva);
                const netWage = totalTaxableGross - totalSoc - totalZdra - finalTax;
                const netTotal = netWage + uniformPay;
                const totalBonuses = nB + wB + hB;

                return { 
                    monthKey, targetYear, targetMonth,
                    list, count: list.length, gross: totalTaxableGross, net: netTotal, netWageOnly: netWage, uniformPay, activeUniformRate, isUniformActive,
                    soc: totalSoc, zdra: totalZdra, rawTax: rawTax, appliedDiscount: Math.min(rawTax, sleva), sleva, 
                    bonuses: { night: nB, weekend: wB, holiday: hB, total: totalBonuses, base: baseW, sick: sickW, vacation: vacW, nightHrs: nHrs, weekendHrs: wHrs, holidayHrs: hHrs }, 
                    actualHrs: list.reduce((a,b)=>a+b.netMinutes,0)/60, workedHrsOnly: workHrs, contractGroups: groups, yearlyDPPHrs,
                    effectiveHourlyRate: workHrs > 0 ? (netTotal / workHrs) : 0
                };
            };

            const monthlyData = useMemo(() => {
                return computeMonthlyMetrics(year, month);
            }, [shifts, month, year, settings]);

            // Meziměsíční porovnání: aktuální měsíc vs. předchozí měsíc
            const momComparison = useMemo(() => {
                const prevDate = new Date(year, month - 1, 1);
                const prevYear = prevDate.getFullYear();
                const prevMonth = prevDate.getMonth();
                const prevData = computeMonthlyMetrics(prevYear, prevMonth);
                const currData = monthlyData;

                const diffNet = currData.net - prevData.net;
                const pctNet = prevData.net > 0 ? ((diffNet / prevData.net) * 100) : (currData.net > 0 ? 100 : 0);

                const diffHours = currData.workedHrsOnly - prevData.workedHrsOnly;
                const pctHours = prevData.workedHrsOnly > 0 ? ((diffHours / prevData.workedHrsOnly) * 100) : (currData.workedHrsOnly > 0 ? 100 : 0);

                const diffGross = currData.gross - prevData.gross;
                const pctGross = prevData.gross > 0 ? ((diffGross / prevData.gross) * 100) : (currData.gross > 0 ? 100 : 0);

                const diffRate = currData.effectiveHourlyRate - prevData.effectiveHourlyRate;
                const pctRate = prevData.effectiveHourlyRate > 0 ? ((diffRate / prevData.effectiveHourlyRate) * 100) : 0;

                const diffBonuses = currData.bonuses.total - prevData.bonuses.total;
                const diffUniform = currData.uniformPay - prevData.uniformPay;
                const diffShifts = currData.count - prevData.count;

                return {
                    prevData,
                    currData,
                    diffNet, pctNet,
                    diffHours, pctHours,
                    diffGross, pctGross,
                    diffRate, pctRate,
                    diffBonuses,
                    diffUniform,
                    diffShifts,
                    prevMonthName: new Intl.DateTimeFormat('cs-CZ', { month: 'long' }).format(prevDate),
                    currMonthName: new Intl.DateTimeFormat('cs-CZ', { month: 'long' }).format(new Date(year, month, 1))
                };
            }, [monthlyData, year, month, shifts, settings]);

            // Historie posledních 6 měsíců pro grafy a trendy
            const last6MonthsData = useMemo(() => {
                const result = [];
                for (let i = 5; i >= 0; i--) {
                    const d = new Date(year, month - i, 1);
                    const y = d.getFullYear();
                    const m = d.getMonth();
                    const data = computeMonthlyMetrics(y, m);
                    result.push({
                        date: d,
                        year: y,
                        month: m,
                        label: new Intl.DateTimeFormat('cs-CZ', { month: 'short' }).format(d),
                        fullLabel: new Intl.DateTimeFormat('cs-CZ', { month: 'long', year: 'numeric' }).format(d),
                        isCurrent: i === 0,
                        ...data
                    });
                }
                const maxNet = Math.max(1, ...result.map(r => r.net));
                const maxHours = Math.max(1, ...result.map(r => r.workedHrsOnly));
                return { list: result, maxNet, maxHours };
            }, [year, month, shifts, settings]);

            // Celoroční statistika (aktuální rok)
            const yearToDateStats = useMemo(() => {
                let totalNet = 0;
                let totalGross = 0;
                let totalHours = 0;
                let totalShifts = 0;
                let totalBonuses = 0;
                let totalUniform = 0;
                let activeMonthsCount = 0;
                let bestMonth = { name: '', net: -1 };

                for (let m = 0; m < 12; m++) {
                    const mData = computeMonthlyMetrics(year, m);
                    if (mData.count > 0 || mData.workedHrsOnly > 0) {
                        activeMonthsCount++;
                        totalNet += mData.net;
                        totalGross += mData.gross;
                        totalHours += mData.workedHrsOnly;
                        totalShifts += mData.count;
                        totalBonuses += mData.bonuses.total;
                        totalUniform += mData.uniformPay;
                        if (mData.net > bestMonth.net) {
                            const d = new Date(year, m, 1);
                            bestMonth = {
                                name: new Intl.DateTimeFormat('cs-CZ', { month: 'long' }).format(d),
                                net: mData.net
                            };
                        }
                    }
                }

                const avgMonthlyNet = activeMonthsCount > 0 ? (totalNet / activeMonthsCount) : 0;
                const avgHourlyNet = totalHours > 0 ? (totalNet / totalHours) : 0;

                return {
                    totalNet,
                    totalGross,
                    totalHours,
                    totalShifts,
                    totalBonuses,
                    totalUniform,
                    activeMonthsCount,
                    avgMonthlyNet,
                    avgHourlyNet,
                    bestMonth
                };
            }, [year, shifts, settings]);

            // Analýza odpracovaného času & Work-Life balance pro vybraný měsíc
            const monthTimeAnalysis = useMemo(() => {
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const mList = monthlyData.list.filter(s => s.type === 'work' && s.netMinutes > 0);
                const workDaysCount = mList.length;
                const offDaysCount = Math.max(0, daysInMonth - workDaysCount);
                const workDaysPct = daysInMonth > 0 ? (workDaysCount / daysInMonth) * 100 : 0;
                const offDaysPct = Math.max(0, 100 - workDaysPct);

                // Průměrná délka a průměrný výdělek na směnu
                const avgShiftHours = workDaysCount > 0 ? (monthlyData.workedHrsOnly / workDaysCount) : 0;
                const avgShiftNet = workDaysCount > 0 ? (monthlyData.net / workDaysCount) : 0;

                // Denní vs. noční hodiny
                const nightHoursTotal = monthlyData.bonuses.nightHrs || 0;
                const dayHoursTotal = Math.max(0, monthlyData.workedHrsOnly - nightHoursTotal);
                const nightHoursPct = monthlyData.workedHrsOnly > 0 ? (nightHoursTotal / monthlyData.workedHrsOnly) * 100 : 0;
                const dayHoursPct = Math.max(0, 100 - nightHoursPct);

                // Analýza dnů v týdnu (Pondělí = 1 až Neděle = 0)
                const weekdayNames = ['Ne', 'Po', 'Út', 'St', 'Čt', 'Pá', 'So'];
                const weekdayFullNames = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
                const dayStats = [1, 2, 3, 4, 5, 6, 0].map(dayIdx => {
